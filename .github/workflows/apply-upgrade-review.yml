name: Apply upgrade review patch

on:
  push:
    branches:
      - feat/0.2.1-mqtt-live-logs
    paths:
      - scripts/apply_upgrade_review_patch.py
      - .github/workflows/apply-upgrade-review.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/0.2.1-mqtt-live-logs
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply exact patch
        run: |
          python scripts/apply_upgrade_review_patch.py
          bash -n deploy/upgrade-0.2.1-from-pve.sh
      - name: Commit patch and remove one-shot machinery
        run: |
          git config user.name "hubinet-ops-review-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm scripts/apply_upgrade_review_patch.py .github/workflows/apply-upgrade-review.yml
          git add deploy/upgrade-0.2.1-from-pve.sh
          git commit -m "fix: make upgrade signal handling deterministic"
          git push origin HEAD:feat/0.2.1-mqtt-live-logs
