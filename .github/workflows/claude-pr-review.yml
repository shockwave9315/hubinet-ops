name: Claude PR Review

on:
  pull_request:
    types:
      - ready_for_review

concurrency:
  group: claude-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Claude native PR review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}

          track_progress: false
          include_fix_links: false
          classify_inline_comments: false
          exclude_comments_by_actor: "*[bot]"

          prompt: |
            /code-review medium ${{ github.event.pull_request.number }} --comment

          settings: |
            {
              "permissions": {
                "allow": [
                  "Read",
                  "Glob",
                  "Grep",
                  "Bash(gh issue view:*)",
                  "Bash(gh search:*)",
                  "Bash(gh issue list:*)",
                  "Bash(gh pr comment:*)",
                  "Bash(gh pr diff:*)",
                  "Bash(gh pr view:*)",
                  "Bash(gh pr list:*)",
                  "mcp__github_inline_comment__create_inline_comment"
                ],
                "deny": [
                  "Edit",
                  "Write",
                  "Bash(git add:*)",
                  "Bash(git commit:*)",
                  "Bash(git push:*)",
                  "Bash(git rm:*)"
                ]
              }
            }

          claude_args: |
            --model sonnet
            --max-budget-usd 2.50
            --append-system-prompt "For this repository, AGENTS.md and ACCEPTED ADRs are authoritative. Before reporting a blocking correctness finding, read the relevant accepted contract surface and require a concrete reachable witness with an observable incorrect result. Do not report speculative hardening or new architecture as an existing blocker. Phase 1B is dormant and read-only; runtime activation and Phase 1C mutation authority are out of scope."
