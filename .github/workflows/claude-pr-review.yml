name: Claude PR Review

on:
  pull_request:
    types:
      - ready_for_review

concurrency:
  group: claude-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify review target
        shell: bash
        run: |
          set -euo pipefail

          ACTUAL_HEAD="$(git rev-parse HEAD)"
          EXPECTED_HEAD="${{ github.event.pull_request.head.sha }}"

          echo "Expected HEAD: $EXPECTED_HEAD"
          echo "Actual HEAD:   $ACTUAL_HEAD"

          test "$ACTUAL_HEAD" = "$EXPECTED_HEAD"

      - name: Install Claude Code
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL https://claude.ai/install.sh | bash -s 2.1.233

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Claude Code
        shell: bash
        run: |
          set -euo pipefail

          claude --version

      - name: Claude native PR review
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}

        run: |
          set -euo pipefail

          claude -p \
            "/code-review medium ${{ github.event.pull_request.number }} --comment" \
            --model sonnet \
            --allowedTools \
              "Read" \
              "Glob" \
              "Grep" \
              "Bash(git:*)" \
              "Bash(gh:*)" \
            --disallowedTools \
              "Edit" \
              "Write"