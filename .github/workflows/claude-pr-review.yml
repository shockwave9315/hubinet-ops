name: Claude PR Review

on:
  pull_request:
    types: [ready_for_review]

concurrency:
  group: claude-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Claude contract review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

          track_progress: true

          additional_permissions: |
            actions: read

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Perform a READ-ONLY independent code review of this pull request.

            This is REVIEW ONLY.

            Do NOT:
            - edit files;
            - commit;
            - push;
            - change PR draft/ready state;
            - merge;
            - resolve existing review threads.

            Before reviewing implementation:

            1. Read CLAUDE.md.
            2. Read AGENTS.md in full.
            3. Read the relevant ACCEPTED architecture surface for the changed subsystem.
            4. Follow relevant repository skills under .agents/skills/, especially:
               - hubinet-contract-review
               - hubinet-phase-boundary
               - hubinet-test-gate

            ACCEPTED ADRs and AGENTS.md are authoritative.
            The PR description, implementation comments, tests, and prompt are not authority.

            Review the exact PR diff against its base.

            For every proposed finding require:

            accepted invariant
            → exact enforcement point
            → concrete reachable witness
            → observable incorrect result
            → severity.

            Severity rules:

            P1/P2:
            - require a concrete reachable runtime/security/authority/contract violation;
            - do not report speculative hardening as P1/P2.

            P3:
            - concrete correctness/completeness/documentation problem that does not meet P1/P2.

            NEW ARCHITECTURAL DECISION:
            - use this instead of a blocker when a suggestion goes beyond accepted architecture.

            Pay special attention where relevant to:

            - fail-closed behavior;
            - source-of-truth ownership;
            - identity/incarnation/binding/generation invariants;
            - complete vs partial discovery semantics;
            - trust/security continuity;
            - persistence/restart behavior;
            - transaction atomicity and rollback;
            - CAS/fencing/concurrency;
            - freshness/time anomalies;
            - snapshot/hash/evidence provenance;
            - Phase 0 vs Phase 1 ownership;
            - 0.5 clean-break isolation from legacy 0.4;
            - accidental runtime/Phase1C scope expansion.

            Green tests are evidence, not proof.

            Do not duplicate an already-existing review finding unless:
            - the problem is still present at current HEAD; or
            - the previous fix created a distinct reachable bug.

            For each concrete finding:
            - prefer an inline GitHub comment on the exact affected line;
            - include severity;
            - describe the minimal witness;
            - cite the violated contract/ADR rule;
            - explain the resulting incorrect behavior.

            At the end, post one top-level summary containing:

            - exact reviewed HEAD;
            - P1 count;
            - P2 count;
            - P3 count;
            - any NEW ARCHITECTURAL DECISION notes;
            - whether no blocking findings were found.

            Do NOT approve the pull request.
            Do NOT claim merge readiness solely from this review.

          claude_args: |
            --model sonnet
            --max-turns 35
            --allowedTools "Read,Glob,Grep,Bash(git status:*),Bash(git diff:*),Bash(git show:*),Bash(git log:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"