name: Apply managed timeout patch

on:
  push:
    branches:
      - feat/0.2.1-mqtt-live-logs
    paths:
      - scripts/apply_managed_timeout_patch.py
      - .github/workflows/apply-managed-timeout.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/0.2.1-mqtt-live-logs
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply exact patch
        run: |
          python scripts/apply_managed_timeout_patch.py
          python -m py_compile deploy/managed/hubinet-maint
      - name: Commit patch and remove one-shot machinery
        run: |
          git config user.name "hubinet-ops-review-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm scripts/apply_managed_timeout_patch.py .github/workflows/apply-managed-timeout.yml
          git add deploy/managed/hubinet-maint
          git commit -m "fix: harden managed APT process termination"
          git push origin HEAD:feat/0.2.1-mqtt-live-logs
