name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile agent
        run: python -m compileall app
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" python -m pytest -q --tb=short 2>&1 | tee pytest.log
      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ github.run_id }}
          path: pytest.log
          if-no-files-found: warn
          retention-days: 7
      - name: Validate shell syntax
        run: |
          find . -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          bash -n deploy/pve/hubinet-ops-host
      - name: Validate managed executor
        run: python -m py_compile deploy/managed/hubinet-maint
      - name: Parse YAML
        run: python scripts/validate_yaml.py
      - name: Reject tracked runtime files
        run: python scripts/check_tracked_files.py

  apply-dashboard-patch:
    if: >-
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/fix/0.2.3-mqtt-attribute-budget' &&
       !startsWith(github.event.head_commit.message, '[automation]')) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'fix/0.2.3-mqtt-attribute-budget')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/0.2.3-mqtt-attribute-budget
          fetch-depth: 0

      - name: Patch package preview counters
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("home-assistant/dashboards/hubinet_ops.yaml")
          text = path.read_text(encoding="utf-8")

          for vmid in (101, 106):
              old_header = f"""                {{% set packages = updates.get('packages', []) %}}
                **{{{{ packages | count }}}} pakietów · ryzyko {{{{ states('sensor.hubinet_ops_ct{vmid}_risk') }}}}**

                | Pakiet | Obecna | Docelowa |"""
              new_header = f"""                {{% set packages = updates.get('packages', []) %}}
                {{% set meta = state_attr('sensor.hubinet_ops_ct{vmid}_health_status', 'attribute_payload') or {{}} %}}
                {{% set total = meta.get('packages_total', states('sensor.hubinet_ops_ct{vmid}_pending_update_count') | int(0)) | int(0) %}}
                {{% set visible = packages | count %}}
                **{{{{ total }}}} pakietów · ryzyko {{{{ states('sensor.hubinet_ops_ct{vmid}_risk') }}}}**

                {{% if meta.get('truncated') and visible < total %}}
                _Podgląd MQTT zawiera {{{{ visible }}}} z {{{{ total }}}} pakietów (limit atrybutów 10 KB)._

                {{% endif %}}
                | Pakiet | Obecna | Docelowa |"""

              old_tail = """                {% if packages | count > 30 %}

                _…oraz {{ packages | count - 30 }} kolejnych pakietów._
                {% endif %}"""
              new_tail = """                {% if visible > 30 %}

                _…oraz {{ visible - 30 }} kolejnych widocznych pakietów._
                {% endif %}"""

              if text.count(old_header) != 1:
                  raise SystemExit(f"CT{vmid}: expected one package header, found {text.count(old_header)}")
              text = text.replace(old_header, new_header, 1)
              if old_tail not in text:
                  raise SystemExit(f"CT{vmid}: package tail not found")
              text = text.replace(old_tail, new_tail, 1)

          path.write_text(text, encoding="utf-8", newline="\n")
          PY

      - name: Commit patch and restore workflows
        run: |
          rm -f .github/workflows/apply-v023-dashboard-patch.yml
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name "hubinet-ops-automation"
          git config user.email "actions@users.noreply.github.com"
          git add home-assistant/dashboards/hubinet_ops.yaml .github/workflows
          git diff --cached --check
          git commit -m "[automation] Show package totals after MQTT truncation"
          git push origin HEAD:fix/0.2.3-mqtt-attribute-budget
