name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile agent
        run: python -m compileall app custom_components/hubinet_ops
      - name: Verify deployment smoke sandbox support
        run: |
          docker version
          docker info --format '{{json .SecurityOptions}}'
      - name: Test
        shell: bash
        env:
          HUBINET_OPS_EPHEMERAL_CI: "1"
        run: |
          set -o pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" python -m pytest -q --tb=short 2>&1 | tee pytest.log
      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ github.run_id }}
          path: pytest.log
          if-no-files-found: warn
          retention-days: 7
      - name: Validate shell syntax
        run: find . -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Parse YAML
        run: python scripts/validate_yaml.py
      - name: Reject tracked runtime files
        run: python scripts/check_tracked_files.py

  home-assistant-2026-8-1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-ha-test.txt
      - name: Install isolated Home Assistant test dependencies
        run: python -m pip install -r requirements-ha-test.txt
      - name: Verify exact Home Assistant target
        run: |
          python -c "import importlib.metadata as m; assert m.version('homeassistant') == '2026.8.1'"
          python -c "import sys; assert sys.version_info >= (3, 14, 2)"
      - name: Test native Home Assistant integration
        run: python -m pytest -q --tb=short -o asyncio_mode=auto tests/test_hubinet_ops_integration.py
