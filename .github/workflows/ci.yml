name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile agent
        run: python -m compileall app
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" python -m pytest -q --tb=short 2>&1 | tee pytest.log
      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ github.run_id }}
          path: pytest.log
          if-no-files-found: warn
          retention-days: 7
      - name: Validate shell syntax
        run: |
          find . -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          bash -n deploy/pve/hubinet-ops-host
      - name: Validate managed executor
        run: python -m py_compile deploy/managed/hubinet-maint
      - name: Parse YAML
        run: python scripts/validate_yaml.py
      - name: Reject tracked runtime files
        run: python scripts/check_tracked_files.py

  update-v023-dashboard-test:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/0.2.3-mqtt-attribute-budget'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/0.2.3-mqtt-attribute-budget
          fetch-depth: 0
      - name: Update the intentional package-preview wording
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_ha.py")
          text = path.read_text(encoding="utf-8")
          old = '    assert "kolejnych pakietów" in text\n'
          new = '    assert text.count("kolejnych widocznych pakietów") == 2\n'
          if text.count(old) != 1:
              raise SystemExit(f"Expected one legacy assertion, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")
          PY
      - name: Commit test update and restore CI
        run: |
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name "hubinet-ops-automation"
          git config user.email "actions@users.noreply.github.com"
          git add tests/test_ha.py .github/workflows/ci.yml
          git diff --cached --check
          git commit -m "[automation] Update package preview wording test"
          git push origin HEAD:fix/0.2.3-mqtt-attribute-budget
