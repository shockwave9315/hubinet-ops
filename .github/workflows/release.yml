name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Decide whether the version is releasable
        id: version
        run: python scripts/release_version.py
      - name: Build immutable release bundle
        if: steps.version.outputs.status == 'release'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          minimum_source=0.4.3
          if [[ "$RELEASE_VERSION" == 0.4.3 ]]; then minimum_source=0.4.2; fi
          python scripts/build_release_bundle.py \
            --version "$RELEASE_VERSION" \
            --commit "$RELEASE_SHA" \
            --minimum-source-version "$minimum_source" \
            --output "dist/hubinet-ops-$RELEASE_VERSION.tar.gz"
      - name: Verify release bundle contract
        if: steps.version.outputs.status == 'release'
        run: python -m pytest -q --tb=short tests/test_v043_release_workflow.py tests/test_v043_application_release.py
      - name: Publish immutable GitHub release
        if: steps.version.outputs.status == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Refusing to replace existing tag $RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            "dist/hubinet-ops-$RELEASE_VERSION.tar.gz" \
            "dist/hubinet-ops-$RELEASE_VERSION.tar.gz.sha256" \
            --target "$RELEASE_SHA" \
            --title "Hubinet Ops $RELEASE_VERSION" \
            --generate-notes
