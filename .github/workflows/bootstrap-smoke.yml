name: Bootstrap Smoke (Sandbox)

# Runs tests/test_bootstrap_proxmox_0_5_smoke.py -- the only test file that
# executes deploy/bootstrap-proxmox-0.5.sh for real -- through the
# AGENTS.md-mandated Docker sandbox (tests/shell/run_bootstrap_smoke_sandbox.sh).
# That launcher is the single system-enforced entry boundary: this workflow
# invokes it and nothing else, and never sets HUBINET_OPS_SYSTEM_SANDBOX
# directly (only the launcher, running inside its own Docker container, is
# permitted to do that).
#
# The pull_request.paths list below is deliberately a COARSE trigger over the
# complete PR diff. Every triggered head runs the bootstrap-smoke job. The job
# hashes the complete smoke dependency surface and reuses only an exact
# successful proof for that content; a cache miss runs the full Docker sandbox.
#
# Job-level concurrency cancels an older run for the same PR/ref. A cancelled
# miss cannot publish actions/cache's success-only post-job proof, so a newer
# head arriving before proof exists also misses and runs the full smoke. A
# docs-only head can skip only the expensive step after an earlier run has
# completed successfully and published the exact same content proof.
#
# Path coverage rule (P2-1, third pass): every file whose change can
# materially change the bootstrap execution the sandbox smoke matrix exercises
# must be listed here AND in the hashFiles(...) fingerprint below. The
# local-safe regression tests check both surfaces stay complete and identical.
# "deploy/lib/hubinet-ops-bootstrap-*.py" is a GLOB covering the whole
# family of python3 helpers the bootstrap pushes into and runs inside the CT.
# deploy/install-0.5.0-fresh.sh and deploy/hubinet-ops-0.5.service are included
# because phase8/phase8b/phase11/phase12 exercise them directly; requirements.txt
# is included for the same reason. tests/test_bootstrap_proxmox_0_5.py remains
# intentionally outside this expensive-smoke dependency list: it never executes
# the real bootstrap and is covered by local/main-branch validation rather than
# being a reason on its own to burn Docker smoke minutes.
on:
  pull_request:
    paths:
      - "deploy/bootstrap-proxmox-0.5.sh"
      - "deploy/lib/bootstrap-*.sh"
      - "deploy/lib/hubinet-ops-bootstrap-*.py"
      - "deploy/install-0.5.0-fresh.sh"
      - "deploy/hubinet-ops-0.5.service"
      - "requirements.txt"
      - "tests/_bootstrap_fake_pve.py"
      - "tests/test_bootstrap_proxmox_0_5_smoke.py"
      - "tests/shell/**"
      - "scripts/validate_hermetic_shell_boundary.py"
      - "AGENTS.md"
      - ".github/workflows/bootstrap-smoke.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  bootstrap-smoke:
    concurrency:
      group: bootstrap-smoke-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    # Must be GitHub-hosted: tests/shell/run_bootstrap_smoke_sandbox.sh
    # itself checks RUNNER_ENVIRONMENT == github-hosted and fails closed
    # otherwise -- GitHub Actions sets that (and GITHUB_ACTIONS,
    # GITHUB_RUN_ID) automatically on every run, so this workflow only
    # needs to add the one workflow-owned marker the launcher additionally
    # requires: HUBINET_OPS_EPHEMERAL_CI=1.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HUBINET_OPS_EPHEMERAL_CI: "1"
    steps:
      - uses: actions/checkout@v4

      # actions/cache saves a miss only from its post-job hook after the job has
      # completed successfully. Failed or cancelled smoke runs publish no proof.
      - name: Restore exact successful bootstrap-smoke proof
        id: bootstrap-smoke-proof
        uses: actions/cache@v4
        with:
          path: .bootstrap-smoke-proof
          key: bootstrap-smoke-proof-v1-${{ hashFiles('deploy/bootstrap-proxmox-0.5.sh', 'deploy/lib/bootstrap-*.sh', 'deploy/lib/hubinet-ops-bootstrap-*.py', 'deploy/install-0.5.0-fresh.sh', 'deploy/hubinet-ops-0.5.service', 'requirements.txt', 'tests/_bootstrap_fake_pve.py', 'tests/test_bootstrap_proxmox_0_5_smoke.py', 'tests/shell/**', 'scripts/validate_hermetic_shell_boundary.py', 'AGENTS.md', '.github/workflows/bootstrap-smoke.yml') }}

      - name: Run the one whole bootstrap smoke matrix through the compliant sandbox
        id: bootstrap-smoke
        if: steps.bootstrap-smoke-proof.outputs.cache-hit != 'true'
        run: bash tests/shell/run_bootstrap_smoke_sandbox.sh

      - name: Stage successful proof for the cache post-job save
        if: success() && steps.bootstrap-smoke-proof.outputs.cache-hit != 'true'
        run: touch .bootstrap-smoke-proof
