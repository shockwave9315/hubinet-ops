      scan: true
      approve: true
      reject: true
      retry_healthcheck: true
      rollback: false
      start: true
      shutdown: true
      reboot: true
    recovery_scan: {enabled: true, delay_seconds: 90, cooldown_seconds: 900}
    repair_actions: [restart_services, restart_required_containers]
    required_services: [containerd.service, docker.service]
    docker:
      enabled: true
      require_health: true
      required:
        - weatherhub-weather-api-1
        - weatherhub-weather-worker-1
        - weatherhub-redis-1
    approval_mode: always
    automatic_rollback: true
    manual_rollback_allowed: false
    dashboard_path: /hubinet-ops/ct-106
    stabilization: &managed_stabilization
      post_update_timeout_seconds: 300
      post_rollback_timeout_seconds: 300
      repair_timeout_seconds: 180
      poll_interval_seconds: 10
      initial_grace_seconds: 10
      required_consecutive_successes: 2

