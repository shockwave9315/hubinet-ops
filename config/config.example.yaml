api:
  bind: 0.0.0.0
  port: 8787

executor:
  proxmox_host: proxmox-host.local
  ssh_user: root
  ssh_key: /etc/hubinet-ops/keys/proxmox_ed25519
  known_hosts: /etc/hubinet-ops/ssh_known_hosts
  connect_timeout_seconds: 10
  command_timeout_seconds: 4800

scheduler:
  enabled: false
  scan_interval_minutes: 360
  initial_scan_delay_seconds: 60
  approval_ttl_minutes: 1440
  state_refresh_seconds: 30
  initial_refresh_delay_seconds: 5

mqtt:
  enabled: false
  host: mqtt-broker.local
  port: 1883
  username: ""
  password: ""
  client_id: hubinet-ops-agent
  base_topic: hubinet/ops
  discovery_prefix: homeassistant
  keepalive_seconds: 60
  reconnect_min_seconds: 2
  reconnect_max_seconds: 60
  retain_state: true

home_assistant:
  webhook_url: ""
  request_timeout_seconds: 10

resources:
  100:
    name: home-assistant
    display_name: Home Assistant
    resource_type: qemu
    adapter: haos
    enabled: true
    criticality: critical
    ip_address: 192.168.4.168
    guest_agent: true
    os: HAOS 16.0
    monitoring: {inspect: true, update_scan: false}
    operator_capabilities: &deny_all
      refresh: false
      scan: false
      approve: false
      reject: false
      retry_healthcheck: false
      rollback: false
      start: false
      shutdown: false
      reboot: false
    recovery_scan: {enabled: false, delay_seconds: 90, cooldown_seconds: 900}
    repair_actions: []
    required_services: []
    docker: {enabled: false, require_health: false, required: []}
    automatic_rollback: false
    manual_rollback_allowed: false
    dashboard_path: /hubinet-ops/vm-100
    stabilization: {}

  101:
    name: cloudflared
    display_name: Cloudflared
    resource_type: lxc
    adapter: apt
    enabled: true
    criticality: high
    ip_address: 192.168.4.153
    os: Debian 12
    monitoring: {inspect: true, update_scan: true}
    operator_capabilities: *deny_all
    recovery_scan: {enabled: false, delay_seconds: 90, cooldown_seconds: 900}
    repair_actions: []
    required_services: [cloudflared.service]
    docker: {enabled: false, require_health: false, required: []}
    automatic_rollback: false
    manual_rollback_allowed: false
    dashboard_path: /hubinet-ops/ct-101
    stabilization: {}

  102:
    name: mariadb
