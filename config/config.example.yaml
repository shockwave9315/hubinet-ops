api:
  bind: 0.0.0.0
  port: 8787

executor:
  proxmox_host: proxmox-host.local
  ssh_user: root
  ssh_key: /etc/hubinet-ops/keys/proxmox_ed25519
  known_hosts: /etc/hubinet-ops/ssh_known_hosts
  connect_timeout_seconds: 10
  command_timeout_seconds: 4800

host_control:
  enabled: true
  base_url: http://192.0.2.10:8741
  backend_token_env: HUBINET_OPS_HOSTD_BACKEND_TOKEN
  update_token_env: HUBINET_OPS_HOSTD_UPDATE_TOKEN
  timeout_seconds: 30
  operation_timeout_seconds: 1800
  poll_interval_seconds: 1

scheduler:
  enabled: false
  approval_ttl_minutes: 1440
  state_refresh_seconds: 30
  initial_refresh_delay_seconds: 5

# Read-only APT availability checks are intentionally independent from manual
# operator scan/update permissions. They never approve or install packages.
monitoring_scheduler:
  enabled: true
  scan_interval_minutes: 360
  initial_scan_delay_seconds: 60

mqtt:
  enabled: false
  host: mqtt-broker.local
  port: 1883
  username: ""
  password: ""
  client_id: hubinet-ops-agent
  base_topic: hubinet/ops
  discovery_prefix: homeassistant
  keepalive_seconds: 60
  reconnect_min_seconds: 2
  reconnect_max_seconds: 60
  retain_state: true

home_assistant:
  webhook_url: ""
  request_timeout_seconds: 10

resources:
  100:
    name: home-assistant
    display_name: Home Assistant
    resource_type: qemu
    adapter: haos
    enabled: true
    criticality: critical
    ip_address: 192.168.4.168
    guest_agent: true
    os: HAOS 16.0
    monitoring: {inspect: true, update_scan: false}
    operator_capabilities: &deny_all
      refresh: false
      scan: false
      approve: false
      reject: false
      retry_healthcheck: false
      rollback: false
      start: false
      shutdown: false
      reboot: false
      force_stop: false
      snapshot_create: false
      snapshot_list: false
      snapshot_rollback: false
      snapshot_delete: false
      self_update: false
    recovery_scan: {enabled: false, delay_seconds: 90, cooldown_seconds: 900}
    repair_actions: []
    required_services: []
    docker: {enabled: false, require_health: false, required: []}
    automatic_rollback: false
    manual_rollback_allowed: false
    manual_snapshot_restore_allowed: false
    dashboard_path: /hubinet-ops/vm-100
    stabilization: {}

  101:
    name: cloudflared
