api:
  bind: 0.0.0.0
  port: 8787

executor:
  proxmox_host: proxmox-host.local
  ssh_user: root
  ssh_key: /etc/hubinet-ops/keys/proxmox_ed25519
  known_hosts: /etc/hubinet-ops/ssh_known_hosts
  connect_timeout_seconds: 10
  command_timeout_seconds: 4800

scheduler:
  enabled: false
  scan_interval_minutes: 360
  initial_scan_delay_seconds: 60
  approval_ttl_minutes: 1440
  state_refresh_seconds: 30
  initial_refresh_delay_seconds: 5

mqtt:
  enabled: false
  host: mqtt-broker.local
  port: 1883
  username: ""
  password: ""
  client_id: hubinet-ops-agent
  base_topic: hubinet/ops
  discovery_prefix: homeassistant
  keepalive_seconds: 60
  reconnect_min_seconds: 2
  reconnect_max_seconds: 60
  retain_state: true

home_assistant:
  webhook_url: ""
  request_timeout_seconds: 10

containers:
  101:
    name: cloudflared
    enabled: true
    adapter: apt
    criticality: medium
    approval_mode: always
    automatic_rollback: true
    manual_rollback_allowed: false
    operator_capabilities:
      refresh: false
      scan: false
      approve: false
      reject: false
      retry_healthcheck: false
      rollback: false
      start: false
      shutdown: false
      reboot: false
    recovery_scan:
      enabled: false
      delay_seconds: 90
      cooldown_seconds: 900
    repair_actions: []
    dashboard_path: /hubinet-ops/ct-101
    stabilization: &default_stabilization
      post_update_timeout_seconds: 300
      post_rollback_timeout_seconds: 300
      repair_timeout_seconds: 180
      poll_interval_seconds: 10
      initial_grace_seconds: 10
      required_consecutive_successes: 2

  106:
    name: weather
    enabled: true
    adapter: apt
    criticality: low
    approval_mode: always
    automatic_rollback: true
    manual_rollback_allowed: true
    operator_capabilities:
      refresh: true
      scan: true
      approve: true
      reject: true
      retry_healthcheck: true
      rollback: true
      start: true
      shutdown: true
      reboot: true
    recovery_scan:
      enabled: true
      delay_seconds: 90
      cooldown_seconds: 900
    repair_actions:
      - restart_services
      - restart_required_containers
    dashboard_path: /hubinet-ops/ct-106
    stabilization: *default_stabilization
