# Hubinet Ops 0.2.1. Replace the host name and secrets locally.
hubinet_ops_scan_url: "http://hubinet-ops-agent.local:8787/api/v1/containers/{{ vmid }}/scan"
hubinet_ops_refresh_url: "http://hubinet-ops-agent.local:8787/api/v1/containers/{{ vmid }}/refresh"
hubinet_ops_retry_healthcheck_url: "http://hubinet-ops-agent.local:8787/api/v1/containers/{{ vmid }}/retry-healthcheck"
hubinet_ops_rollback_url: "http://hubinet-ops-agent.local:8787/api/v1/containers/{{ vmid }}/rollback"
hubinet_ops_approve_url: "http://hubinet-ops-agent.local:8787/api/v1/plans/approve"
hubinet_ops_reject_url: "http://hubinet-ops-agent.local:8787/api/v1/plans/reject"
hubinet_ops_authorization: "Bearer REPLACE_WITH_AGENT_TOKEN"
hubinet_ops_webhook_id: "REPLACE_WITH_PRIVATE_WEBHOOK_ID"
hubinet_ops_notify_service: "notify.mobile_app_your_phone"
