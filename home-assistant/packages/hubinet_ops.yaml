# Hubinet Ops 0.4.0: typed resource actions; backend and hostd enforce policy.

recorder:
  exclude:
    entities:
      - sensor.hubinet_ops_agent_last_refresh
      - sensor.hubinet_ops_vm100_last_refresh
      - sensor.hubinet_ops_ct101_last_refresh
      - sensor.hubinet_ops_ct102_last_refresh
      - sensor.hubinet_ops_ct103_last_refresh
      - sensor.hubinet_ops_ct104_last_refresh
      - sensor.hubinet_ops_ct105_last_refresh
      - sensor.hubinet_ops_ct106_last_refresh
      - sensor.hubinet_ops_ct107_last_refresh
      - sensor.hubinet_ops_ct108_last_refresh
      - sensor.hubinet_ops_ct109_last_refresh
      - sensor.hubinet_ops_ct110_last_refresh
      - sensor.hubinet_ops_ct101_job_progress
      - sensor.hubinet_ops_ct102_job_progress
      - sensor.hubinet_ops_ct103_job_progress
      - sensor.hubinet_ops_ct104_job_progress
      - sensor.hubinet_ops_ct105_job_progress
      - sensor.hubinet_ops_ct106_job_progress
      - sensor.hubinet_ops_ct107_job_progress
      - sensor.hubinet_ops_ct108_job_progress
      - sensor.hubinet_ops_ct109_job_progress
      - sensor.hubinet_ops_ct110_job_progress

rest_command:
  hubinet_ops_scan_container:
    url: !secret hubinet_ops_scan_url
    method: POST
    headers: &hubinet_auth_headers
      Authorization: !secret hubinet_ops_authorization
      Content-Type: application/json
    payload: "{}"
    timeout: 780

  hubinet_ops_refresh_container:
    url: !secret hubinet_ops_refresh_url
    method: POST
    headers: *hubinet_auth_headers
    payload: "{}"
    timeout: 180

  hubinet_ops_retry_healthcheck:
    url: !secret hubinet_ops_retry_healthcheck_url
    method: POST
    headers: *hubinet_auth_headers
    payload: >-
      {"request_id":"ha-{{ utcnow().strftime('%Y%m%dT%H%M%S') }}-{{ vmid | int }}-health"}
    timeout: 600

  hubinet_ops_rollback:
    url: !secret hubinet_ops_rollback_url
    method: POST
    headers: *hubinet_auth_headers
    payload: "{}"
    timeout: 1800

  hubinet_ops_approve:
    url: !secret hubinet_ops_approve_url
    method: POST
    headers: *hubinet_auth_headers
    payload: >-
      {"request_id":"ha-{{ utcnow().strftime('%Y%m%dT%H%M%S') }}-{{ vmid | int }}-approve"}
    timeout: 20

  hubinet_ops_reject:
    url: !secret hubinet_ops_reject_url
    method: POST
    headers: *hubinet_auth_headers
    payload: "{}"
    timeout: 20

  hubinet_ops_self_update_plan:
    url: !secret hubinet_ops_self_update_plan_url
    method: POST
    headers: *hubinet_auth_headers
    payload: "{}"
    timeout: 30

  hubinet_ops_start_container:
    url: !secret hubinet_ops_start_url
    method: POST
    headers: *hubinet_auth_headers
    payload: >-
      {"request_id":"ha-{{ utcnow().strftime('%Y%m%dT%H%M%S') }}-{{ vmid | int }}-start"}
    timeout: 210

  hubinet_ops_shutdown_container:
    url: !secret hubinet_ops_shutdown_url
    method: POST
    headers: *hubinet_auth_headers
    payload: >-
      {"request_id":"ha-{{ utcnow().strftime('%Y%m%dT%H%M%S') }}-{{ vmid | int }}-shutdown"}
    timeout: 210

  hubinet_ops_reboot_container:
    url: !secret hubinet_ops_reboot_url
    method: POST
    headers: *hubinet_auth_headers
    payload: >-
      {"request_id":"ha-{{ utcnow().strftime('%Y%m%dT%H%M%S') }}-{{ vmid | int }}-reboot"}
    timeout: 210

  hubinet_ops_force_stop_container:
    url: !secret hubinet_ops_force_stop_url
    method: POST
    headers: *hubinet_auth_headers
    payload: >-
      {"request_id":"ha-{{ utcnow().strftime('%Y%m%dT%H%M%S') }}-{{ vmid | int }}-force"}
    timeout: 210

  hubinet_ops_snapshot_create:
    url: !secret hubinet_ops_snapshot_create_url
    method: POST
    headers: *hubinet_auth_headers
    payload: >-
      {"request_id":"ha-{{ utcnow().strftime('%Y%m%dT%H%M%S') }}-{{ vmid | int }}-snap-create"}
    timeout: 30

  hubinet_ops_snapshot_restore:
    url: !secret hubinet_ops_snapshot_restore_url
    method: POST
    headers: *hubinet_auth_headers
    payload: >-
      {"request_id":"ha-{{ utcnow().strftime('%Y%m%dT%H%M%S') }}-{{ vmid | int }}-snap-restore"}
    timeout: 30

  hubinet_ops_snapshot_delete:
    url: !secret hubinet_ops_snapshot_delete_url
    method: DELETE
    headers: *hubinet_auth_headers
    payload: >-
      {"request_id":"ha-{{ utcnow().strftime('%Y%m%dT%H%M%S') }}-{{ vmid | int }}-snap-delete"}
    timeout: 30

  hubinet_ops_host_start:
    url: !secret hubinet_ops_host_start_url
    method: POST
    headers:
      Authorization: !secret hubinet_ops_host_authorization
      Content-Type: application/json
    payload: >-
      {"request_id":"ha-{{ utcnow().strftime('%Y%m%dT%H%M%S') }}-110-start"}
    timeout: 30

  hubinet_ops_host_offline_snapshot_restore:
    url: !secret hubinet_ops_host_offline_snapshot_restore_url
    method: POST
    headers:
      Authorization: !secret hubinet_ops_host_recovery_authorization
      Content-Type: application/json
    payload: >-
      {"request_id":"ha-{{ utcnow().strftime('%Y%m%dT%H%M%S') }}-110-offline-restore-{{ snapshot_name }}","confirm":"RESTORE_CT110_OFFLINE"}
    timeout: 30

  hubinet_ops_host_offline_force_stop:
    url: !secret hubinet_ops_host_offline_force_stop_url
    method: POST
    headers:
      Authorization: !secret hubinet_ops_host_recovery_authorization
      Content-Type: application/json
    payload: >-
      {"request_id":"ha-{{ utcnow().strftime('%Y%m%dT%H%M%S') }}-110-recovery-force-stop","confirm":"FORCE_STOP_CT110_RECOVERY"}
    timeout: 30

script:
  hubinet_ops_report_action:
    alias: "Hubinet Ops — pokaż wynik akcji"
    mode: parallel
    fields:
      vmid: {required: true}
      action_name: {required: true}
      response: {required: false}
    sequence:
      - action: persistent_notification.create
        data:
          notification_id: "hubinet_ops_action_ct{{ vmid | int }}"
          title: "Hubinet Ops — {{ action_name }} CT{{ vmid | int }}"
          message: >-
            {% set result = response | default({}, true) %}
            {{ 'Żądanie przyjęte.' if result.get('status', 0) in [200, 202]
               else 'Błąd: ' ~ result.get('content', {}).get('detail', result.get('content', {}).get('error', 'usługa niedostępna')) }}

  hubinet_ops_start_container:
    alias: "Hubinet Ops — uruchom kontener"
    mode: single
    fields: &lifecycle_vmid_field
      vmid:
        required: true
        selector:
          number:
            min: 1
            max: 999999
    sequence:
      - choose:
          - conditions: "{{ vmid | int == 110 }}"
            sequence:
              - continue_on_error: true
                action: rest_command.hubinet_ops_host_start
                data: {}
                response_variable: response
        default:
          - continue_on_error: true
            action: rest_command.hubinet_ops_start_container
            data:
              vmid: "{{ vmid | int }}"
            response_variable: response
      - action: script.hubinet_ops_report_action
        data: {vmid: "{{ vmid | int }}", action_name: "uruchomienie", response: "{{ response | default({}) }}"}

  hubinet_ops_shutdown_container:
    alias: "Hubinet Ops — wyłącz kontener łagodnie"
    mode: single
    fields: *lifecycle_vmid_field
    sequence:
      - continue_on_error: true
        action: rest_command.hubinet_ops_shutdown_container
        data:
          vmid: "{{ vmid | int }}"
        response_variable: response
      - action: script.hubinet_ops_report_action
        data: {vmid: "{{ vmid | int }}", action_name: "łagodne wyłączenie", response: "{{ response | default({}) }}"}

  hubinet_ops_reboot_container:
    alias: "Hubinet Ops — uruchom kontener ponownie"
    mode: single
    fields: *lifecycle_vmid_field
    sequence:
      - continue_on_error: true
        action: rest_command.hubinet_ops_reboot_container
        data:
          vmid: "{{ vmid | int }}"
        response_variable: response
      - action: script.hubinet_ops_report_action
        data: {vmid: "{{ vmid | int }}", action_name: "restart", response: "{{ response | default({}) }}"}

  hubinet_ops_force_stop_container:
    alias: "Hubinet Ops — zatrzymaj kontener natychmiast"
    mode: single
    fields: *lifecycle_vmid_field
    sequence:
      - continue_on_error: true
        action: rest_command.hubinet_ops_force_stop_container
        data: {vmid: "{{ vmid | int }}"}
        response_variable: response
      - action: script.hubinet_ops_report_action
        data: {vmid: "{{ vmid | int }}", action_name: "natychmiastowe zatrzymanie", response: "{{ response | default({}) }}"}

  hubinet_ops_snapshot_create:
    alias: "Hubinet Ops — utwórz snapshot"
    mode: single
    fields: *lifecycle_vmid_field
    sequence:
      - continue_on_error: true
        action: rest_command.hubinet_ops_snapshot_create
        data: {vmid: "{{ vmid | int }}"}
        response_variable: response
      - action: script.hubinet_ops_report_action
        data: {vmid: "{{ vmid | int }}", action_name: "utworzenie snapshotu", response: "{{ response | default({}) }}"}

  hubinet_ops_snapshot_restore_latest:
    alias: "Hubinet Ops — przywróć ostatni snapshot"
    mode: single
    fields: *lifecycle_vmid_field
    variables:
      snapshot_name: "{{ states('sensor.hubinet_ops_ct' ~ (vmid | int) ~ '_latest_snapshot_name') }}"
    sequence:
      - choose:
          - conditions: "{{ snapshot_name not in ['none', 'unknown', 'unavailable', ''] }}"
            sequence:
              - continue_on_error: true
                action: rest_command.hubinet_ops_snapshot_restore
                data: {vmid: "{{ vmid | int }}", snapshot_name: "{{ snapshot_name }}"}
                response_variable: response
        default:
          - variables:
              response: {status: 409, content: {detail: "Brak snapshotu Hubinet Ops do przywrócenia"}}
      - action: script.hubinet_ops_report_action
        data: {vmid: "{{ vmid | int }}", action_name: "przywrócenie snapshotu", response: "{{ response | default({}) }}"}

  hubinet_ops_snapshot_delete_latest:
    alias: "Hubinet Ops — usuń ostatni snapshot"
    mode: single
    fields: *lifecycle_vmid_field
    variables:
      snapshot_name: "{{ states('sensor.hubinet_ops_ct' ~ (vmid | int) ~ '_latest_snapshot_name') }}"
    sequence:
      - choose:
          - conditions: "{{ snapshot_name not in ['none', 'unknown', 'unavailable', ''] }}"
            sequence:
              - continue_on_error: true
                action: rest_command.hubinet_ops_snapshot_delete
                data: {vmid: "{{ vmid | int }}", snapshot_name: "{{ snapshot_name }}"}
                response_variable: response
        default:
          - variables:
              response: {status: 409, content: {detail: "Brak snapshotu Hubinet Ops do usunięcia"}}
      - action: script.hubinet_ops_report_action
        data: {vmid: "{{ vmid | int }}", action_name: "usunięcie snapshotu", response: "{{ response | default({}) }}"}

  hubinet_ops_offline_snapshot_restore_ct110:
    alias: "Hubinet Ops — AWARYJNE przywrócenie CT110 offline"
    description: >-
      Operacja break-glass tylko dla zatrzymanego CT110. Omija działający backend
      i po następnym starcie świadomie unieważnia jego aktywne plany i joby.
    mode: single
    variables:
      snapshot_name: "{{ states('sensor.hubinet_ops_ct110_latest_snapshot_name') }}"
    sequence:
      - choose:
          - conditions: "{{ snapshot_name not in ['none', 'unknown', 'unavailable', ''] }}"
            sequence:
              - continue_on_error: true
                action: rest_command.hubinet_ops_host_offline_snapshot_restore
                data: {snapshot_name: "{{ snapshot_name }}"}
                response_variable: response
        default:
          - variables:
              response: {status: 409, content: {detail: "Brak snapshotu CT110 do awaryjnego przywrócenia"}}
      - action: script.hubinet_ops_report_action
        data:
          vmid: 110
          action_name: "AWARYJNE przywrócenie CT110 offline"
          response: "{{ response | default({}) }}"

  hubinet_ops_offline_force_stop_ct110:
    alias: "Hubinet Ops — AWARYJNE wymuszenie zatrzymania CT110"
    description: >-
      Osobna operacja break-glass z tokenem recovery. Nie jest automatycznym
      fallbackiem po błędzie zwykłej operacji backendu.
    mode: single
    sequence:
      - continue_on_error: true
        action: rest_command.hubinet_ops_host_offline_force_stop
        data: {}
        response_variable: response
      - action: script.hubinet_ops_report_action
        data:
          vmid: 110
          action_name: "AWARYJNE wymuszenie zatrzymania CT110"
          response: "{{ response | default({}) }}"

  hubinet_ops_self_update:
    alias: "Hubinet Ops — przygotuj plan aktualizacji control plane"
    mode: single
    fields: *lifecycle_vmid_field
    sequence:
      - choose:
          - conditions: "{{ vmid | int == 110 }}"
            sequence:
              - continue_on_error: true
                action: rest_command.hubinet_ops_self_update_plan
                data: {vmid: 110}
                response_variable: response
        default:
          - variables:
              response: {status: 403, content: {detail: "Self-update jest dozwolony wyłącznie dla CT110"}}
      - action: script.hubinet_ops_report_action
        data: {vmid: 110, action_name: "plan aktualizacji control plane", response: "{{ response | default({}) }}"}

  hubinet_ops_scan_container:
    alias: "Hubinet Ops — skanuj kontener"
    mode: parallel
    fields: &vmid_field
      vmid:
        required: true
        selector:
          number:
            min: 1
            max: 999999
    sequence:
      - continue_on_error: true
        action: rest_command.hubinet_ops_scan_container
        data:
          vmid: "{{ vmid | int }}"
        response_variable: response
      - action: script.hubinet_ops_report_action
        data: {vmid: "{{ vmid | int }}", action_name: "skan aktualizacji", response: "{{ response | default({}) }}"}

  hubinet_ops_refresh_container:
    alias: "Hubinet Ops — odśwież kontener"
    mode: parallel
    fields: *vmid_field
    sequence:
      - continue_on_error: true
        action: rest_command.hubinet_ops_refresh_container
        data:
          vmid: "{{ vmid | int }}"
        response_variable: response
      - action: script.hubinet_ops_report_action
        data: {vmid: "{{ vmid | int }}", action_name: "odświeżenie", response: "{{ response | default({}) }}"}

  hubinet_ops_retry_healthcheck:
    alias: "Hubinet Ops — ponów healthcheck"
    mode: parallel
    fields: *vmid_field
    sequence:
      - continue_on_error: true
        action: rest_command.hubinet_ops_retry_healthcheck
        data:
          vmid: "{{ vmid | int }}"
        response_variable: response
      - action: script.hubinet_ops_report_action
        data: {vmid: "{{ vmid | int }}", action_name: "healthcheck", response: "{{ response | default({}) }}"}

  hubinet_ops_rollback:
    alias: "Hubinet Ops — rollback"
    mode: single
    fields: *vmid_field
    sequence:
      - continue_on_error: true
        action: rest_command.hubinet_ops_rollback
        data:
          vmid: "{{ vmid | int }}"
        response_variable: response
      - action: script.hubinet_ops_report_action
        data: {vmid: "{{ vmid | int }}", action_name: "rollback operacji", response: "{{ response | default({}) }}"}

  hubinet_ops_approve_container:
    alias: "Hubinet Ops — zatwierdź plan"
    mode: parallel
    fields: *vmid_field
    sequence:
      - continue_on_error: true
        action: rest_command.hubinet_ops_approve
        data:
          vmid: "{{ vmid | int }}"
        response_variable: response
      - action: persistent_notification.create
        data:
          notification_id: "hubinet_ops_action_ct{{ vmid | int }}"
          title: "Hubinet Ops — zatwierdzenie planu CT{{ vmid | int }}"
          message: >-
            {{ 'Żądanie przyjęte.' if (response | default({})).get('status', 0) in [200, 202]
               else 'Błąd: ' ~ ((response | default({})).get('content', {}).get('detail', 'backend niedostępny lub brak aktywnego planu')) }}

  hubinet_ops_reject_container:
    alias: "Hubinet Ops — odrzuć plan"
    mode: parallel
    fields: *vmid_field
    sequence:
      - continue_on_error: true
        action: rest_command.hubinet_ops_reject
        data:
          vmid: "{{ vmid | int }}"
        response_variable: response
      - action: persistent_notification.create
        data:
          notification_id: "hubinet_ops_action_ct{{ vmid | int }}"
          title: "Hubinet Ops — odrzucenie planu CT{{ vmid | int }}"
          message: >-
            {{ 'Plan odrzucony.' if (response | default({})).get('status', 0) in [200, 202]
               else 'Błąd: ' ~ ((response | default({})).get('content', {}).get('detail', 'backend niedostępny lub brak aktywnego planu')) }}

automation:
  - id: hubinet_ops_webhook_notifications_v022
    alias: "Hubinet Ops 0.2.2 — zdarzenia agenta"
    mode: queued
    max: 30
    triggers:
      - trigger: webhook
        webhook_id: !secret hubinet_ops_webhook_id
        allowed_methods:
          - POST
        local_only: true
    variables:
      event_type: "{{ trigger.json.event_type | default('unknown') }}"
      container: "{{ trigger.json.container | default('nieznany kontener') }}"
      vmid: "{{ trigger.json.vmid | default('?') }}"
      dashboard_path: "{{ trigger.json.dashboard_path | default('/hubinet-ops/overview') }}"
      job_tag: "hubinet_ops_ct{{ vmid }}_job"
    actions:
      - choose:
          - conditions: "{{ event_type == 'approval_required' }}"
            sequence:
              - action: !secret hubinet_ops_notify_service
                data:
                  title: "⚠️ CT{{ vmid }} {{ container }} — decyzja"
                  message: |-
                    Dostępne aktualizacje: {{ trigger.json.pending_count | default('?') }}.
                    Ryzyko: {{ trigger.json.risk | default('unknown') }}. Otwórz panel i sprawdź plan.
                  data:
                    tag: "{{ job_tag }}"
                    group: hubinet_ops
                    channel: "Hubinet Ops"
                    importance: high
                    priority: high
                    ttl: 0
                    notification_icon: mdi:package-up
                    color: "#FF9800"
                    url: "{{ dashboard_path }}"
                    clickAction: "{{ dashboard_path }}"

          - conditions: "{{ event_type == 'job_queued' }}"
            sequence:
              - action: !secret hubinet_ops_notify_service
                data:
                  title: "🚀 CT{{ vmid }} {{ container }} — start"
                  message: "Plan zatwierdzony. Aktualizacja została dodana do kolejki."
                  data:
                    tag: "{{ job_tag }}"
                    group: hubinet_ops
                    channel: "Hubinet Ops progress"
                    importance: low
                    alert_once: true
                    live_update: true
                    sticky: true
                    progress: 1
                    progress_max: 100
                    notification_icon: mdi:progress-wrench
                    color: "#2196F3"
                    url: "{{ dashboard_path }}"
                    clickAction: "{{ dashboard_path }}"

          - conditions: "{{ event_type == 'job_success' }}"
            sequence:
              - action: !secret hubinet_ops_notify_service
                data:
                  title: "✅ CT{{ vmid }} {{ container }} — gotowe"
                  message: >-
                    Zaktualizowano: {{ trigger.json.packages_updated_count | default(0) }}
                    Pozostało: {{ 'nie udało się sprawdzić' if trigger.json.packages_remaining_count is none else trigger.json.packages_remaining_count | default(0) }}
                    APT/dpkg: {{ 'OK' if trigger.json.apt_check_ok | default(false) and trigger.json.dpkg_audit_ok | default(false) else 'BŁĄD' }}
                    Docker: {{ trigger.json.docker_required_healthy | default(0) }}/{{ trigger.json.docker_required_total | default(0) }} healthy
                    Restart wymagany: {{ 'nieznany' if trigger.json.reboot_required is none else 'tak' if trigger.json.reboot_required else 'nie' }}
                    {% if trigger.json.verification_warning | default('', true) %}Ostrzeżenie: {{ trigger.json.verification_warning }}{% endif %}
                  data:
                    tag: "{{ job_tag }}"
                    group: hubinet_ops
                    channel: "Hubinet Ops"
                    importance: default
                    sticky: false
                    timeout: 3600
                    notification_icon: mdi:check-decagram
                    color: "#4CAF50"
                    url: "{{ dashboard_path }}"
                    clickAction: "{{ dashboard_path }}"

          - conditions: "{{ event_type == 'job_rolled_back' }}"
            sequence:
              - action: !secret hubinet_ops_notify_service
                data:
                  title: "↩️ CT{{ vmid }} {{ container }} — rollback"
                  message: "Aktualizacja nie przeszła. Snapshot został przywrócony, a stabilizacja zakończona."
                  data:
                    tag: "{{ job_tag }}"
                    group: hubinet_ops
                    channel: "Hubinet Ops alerts"
                    importance: high
                    priority: high
                    ttl: 0
                    sticky: true
                    notification_icon: mdi:backup-restore
                    color: "#FF9800"
                    url: "{{ dashboard_path }}"
                    clickAction: "{{ dashboard_path }}"

          - conditions: >-
              {{ event_type in ['manual_intervention_required', 'job_blocked', 'scan_failed'] }}
            sequence:
              - action: !secret hubinet_ops_notify_service
                data:
                  title: "🚨 CT{{ vmid }} {{ container }} — wymaga uwagi"
                  message: >-
                    {{ trigger.json.error | default('Sprawdź stan kontenera i ostatnie logi w Hubinet Ops.') }}
                  data:
                    tag: "{{ job_tag }}"
                    group: hubinet_ops
                    channel: "Hubinet Ops alerts"
                    importance: high
                    priority: high
                    ttl: 0
                    sticky: true
                    notification_icon: mdi:alert-octagon
                    color: "#F44336"
                    url: "{{ dashboard_path }}"
                    clickAction: "{{ dashboard_path }}"

          - conditions: "{{ event_type == 'lifecycle_success' }}"
            sequence:
              - action: !secret hubinet_ops_notify_service
                data:
                  title: "✅ CT{{ vmid }} {{ container }} — operacja zakończona"
                  message: >-
                    {% set labels = {'start': 'Uruchomienie', 'shutdown': 'Łagodne wyłączenie', 'reboot': 'Ponowne uruchomienie'} %}
                    {% if trigger.json.health_pending | default(false) %}
                    {{ labels.get(trigger.json.action, 'Operacja lifecycle') }}: LXC działa, weryfikacja usług oczekuje na telemetrię.
                    {% else %}
                    {{ labels.get(trigger.json.action, 'Operacja lifecycle') }} zakończone pomyślnie; stan LXC został potwierdzony.
                    {% endif %}
                  data:
                    tag: "hubinet_ops_ct{{ vmid }}_lifecycle"
                    group: hubinet_ops
                    channel: "Hubinet Ops"
                    importance: default
                    notification_icon: mdi:server-check
                    color: "#4CAF50"
                    url: "{{ dashboard_path }}"
                    clickAction: "{{ dashboard_path }}"

          - conditions: "{{ event_type == 'lifecycle_failed' }}"
            sequence:
              - action: !secret hubinet_ops_notify_service
                data:
                  title: "🚨 CT{{ vmid }} {{ container }} — błąd lifecycle"
                  message: "{{ trigger.json.error | default('Operacja lifecycle nie powiodła się.') }}"
                  data:
                    tag: "hubinet_ops_ct{{ vmid }}_lifecycle"
                    group: hubinet_ops
                    channel: "Hubinet Ops alerts"
                    importance: high
                    priority: high
                    ttl: 0
                    notification_icon: mdi:server-off
                    color: "#F44336"
                    url: "{{ dashboard_path }}"
                    clickAction: "{{ dashboard_path }}"

  - id: hubinet_ops_live_progress_v040
    alias: "Hubinet Ops 0.4.0 — progress operacji na telefonie"
    mode: parallel
    max: 9
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: sensor.hubinet_ops_ct101_active_job_id
        id: ct101
      - trigger: state
        entity_id: sensor.hubinet_ops_ct102_active_job_id
        id: ct102
      - trigger: state
        entity_id: sensor.hubinet_ops_ct103_active_job_id
        id: ct103
      - trigger: state
        entity_id: sensor.hubinet_ops_ct104_active_job_id
        id: ct104
      - trigger: state
        entity_id: sensor.hubinet_ops_ct105_active_job_id
        id: ct105
      - trigger: state
        entity_id: sensor.hubinet_ops_ct106_active_job_id
        id: ct106
      - trigger: state
        entity_id: sensor.hubinet_ops_ct107_active_job_id
        id: ct107
      - trigger: state
        entity_id: sensor.hubinet_ops_ct108_active_job_id
        id: ct108
      - trigger: state
        entity_id: sensor.hubinet_ops_ct109_active_job_id
        id: ct109
    variables:
      vmid: "{{ trigger.id[2:] | int }}"
      container: "CT{{ vmid }}"
      entity_prefix: "sensor.hubinet_ops_ct{{ vmid }}_"
      dashboard_path: "/hubinet-ops/ct-{{ vmid }}"
    conditions:
      - condition: template
        value_template: >-
          {{ states(entity_prefix ~ 'active_job_id') not in [none, '', 'none', 'unknown', 'unavailable']
             and states(entity_prefix ~ 'operation_status') == 'running' }}
    actions:
      - repeat:
          while:
            - condition: template
              value_template: >-
                {{ states(entity_prefix ~ 'operation_status') == 'running'
                   and states(entity_prefix ~ 'active_job_id') not in [none, '', 'none', 'unknown', 'unavailable'] }}
          sequence:
            - variables:
                current_progress: "{{ states(entity_prefix ~ 'job_progress') | int(0) }}"
                current_stage: "{{ states(entity_prefix ~ 'job_stage') | default('idle', true) | replace('_', ' ') }}"
                current_event: "{{ states(entity_prefix ~ 'last_job_event') }}"
            - action: !secret hubinet_ops_notify_service
              data:
                title: "⚙️ CT{{ vmid }} {{ container }} — {{ current_progress }}%"
                message: >-
                  {{ current_stage | title }}{% if current_event not in ['none', 'unknown', 'unavailable'] %} · {{ current_event }}{% endif %}
                data:
                  tag: "hubinet_ops_ct{{ vmid }}_job"
                  group: hubinet_ops
                  channel: "Hubinet Ops progress"
                  importance: low
                  alert_once: true
                  live_update: true
                  sticky: true
                  progress: "{{ current_progress }}"
                  progress_max: 100
                  notification_icon: mdi:progress-wrench
                  color: "#2196F3"
                  url: "{{ dashboard_path }}"
                  clickAction: "{{ dashboard_path }}"
            - delay: "00:00:10"

  - id: hubinet_ops_health_watchdog_v022
    alias: "Hubinet Ops 0.2.2 — watchdog dostępności i zdrowia"
    mode: queued
    max: 20
    triggers:
      - trigger: state
        entity_id: sensor.hubinet_ops_agent_availability
        to: offline
        for: "00:02:00"
        id: agent_problem
      - trigger: state
        entity_id: sensor.hubinet_ops_agent_availability
        to: online
        for: "00:00:30"
        id: agent_recovery
      - trigger: state
        entity_id: sensor.hubinet_ops_ct101_health_status
        to: critical
        for: "00:01:00"
        id: ct101_problem
      - trigger: state
        entity_id: sensor.hubinet_ops_ct101_health_status
        to: offline
        for: "00:01:00"
        id: ct101_problem
      - trigger: state
        entity_id: sensor.hubinet_ops_ct101_health_status
        to: healthy
        for: "00:00:30"
        id: ct101_recovery
      - trigger: state
        entity_id: sensor.hubinet_ops_ct106_health_status
        to: critical
        for: "00:01:00"
        id: ct106_problem
      - trigger: state
        entity_id: sensor.hubinet_ops_ct106_health_status
        to: offline
        for: "00:01:00"
        id: ct106_problem
      - trigger: state
        entity_id: sensor.hubinet_ops_ct106_health_status
        to: healthy
        for: "00:00:30"
        id: ct106_recovery
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.to_state is not none
             and (trigger.from_state is none or trigger.from_state.state != trigger.to_state.state) }}
      - condition: template
        value_template: >-
          {{ not trigger.id.endswith('_recovery')
             or (trigger.from_state is not none and trigger.from_state.state in ['critical', 'offline', 'degraded']) }}
      - condition: template
        value_template: >-
          {{ not trigger.id.endswith('_recovery')
             or trigger.id.startswith('agent_')
             or as_timestamp(state_attr(trigger.entity_id, 'recovery_notification_suppressed_until'), 0) <= as_timestamp(now()) }}
      - condition: template
        value_template: >-
          {{ not trigger.id.endswith('_problem')
             or trigger.id.startswith('agent_')
             or (not (state_attr(trigger.entity_id, 'intentional_shutdown') | bool(false))
                 and state_attr(trigger.entity_id, 'lifecycle_status') != 'running') }}
    variables:
      is_problem: "{{ trigger.id.endswith('_problem') }}"
      is_agent: "{{ trigger.id.startswith('agent_') }}"
      vmid: >-
        {{ 101 if trigger.id.startswith('ct101_') else 106 if trigger.id.startswith('ct106_') else 'agent' }}
      container: >-
        {{ 'cloudflared' if trigger.id.startswith('ct101_') else 'weather' if trigger.id.startswith('ct106_') else 'Hubinet Ops Agent' }}
      dashboard_path: >-
        {{ '/hubinet-ops/ct-101' if trigger.id.startswith('ct101_') else '/hubinet-ops/ct-106' if trigger.id.startswith('ct106_') else '/hubinet-ops/overview' }}
      notification_tag: "hubinet_ops_{{ vmid }}_health"
    actions:
      - choose:
          - conditions: "{{ is_problem }}"
            sequence:
              - action: !secret hubinet_ops_notify_service
                data:
                  title: >-
                    🚨 {{ container }} — {{ trigger.to_state.state }}
                  message: >-
                    {% if is_agent %}Agent nie publikuje telemetrii MQTT.{% else %}CT{{ vmid }} zgłasza stan {{ trigger.to_state.state }}.{% endif %}
                  data:
                    tag: "{{ notification_tag }}"
                    group: hubinet_ops
                    channel: "Hubinet Ops alerts"
                    importance: high
                    priority: high
                    ttl: 0
                    sticky: true
                    notification_icon: mdi:server-alert
                    color: "#F44336"
                    url: "{{ dashboard_path }}"
                    clickAction: "{{ dashboard_path }}"
        default:
          - action: !secret hubinet_ops_notify_service
            data:
              title: "✅ {{ container }} — odzyskano"
              message: >-
                {% if is_agent %}Telemetria MQTT znów jest online.{% else %}CT{{ vmid }} wrócił do stanu healthy.{% endif %}
              data:
                tag: "{{ notification_tag }}"
                group: hubinet_ops
                channel: "Hubinet Ops"
                importance: default
                sticky: false
                timeout: 1800
                notification_icon: mdi:server-security
                color: "#4CAF50"
                url: "{{ dashboard_path }}"
                clickAction: "{{ dashboard_path }}"
