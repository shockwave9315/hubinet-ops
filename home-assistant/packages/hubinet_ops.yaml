# Hubinet Ops 0.2.1: MQTT Discovery state, authenticated REST actions, navigation-only push.

rest_command:
  hubinet_ops_scan_container:
    url: !secret hubinet_ops_scan_url
    method: POST
    headers: &hubinet_auth_headers
      Authorization: !secret hubinet_ops_authorization
      Content-Type: application/json
    payload: "{}"
    timeout: 360

  hubinet_ops_refresh_container:
    url: !secret hubinet_ops_refresh_url
    method: POST
    headers: *hubinet_auth_headers
    payload: "{}"
    timeout: 120

  hubinet_ops_retry_healthcheck:
    url: !secret hubinet_ops_retry_healthcheck_url
    method: POST
    headers: *hubinet_auth_headers
    payload: "{}"
    timeout: 360

  hubinet_ops_rollback:
    url: !secret hubinet_ops_rollback_url
    method: POST
    headers: *hubinet_auth_headers
    payload: "{}"
    timeout: 1500

  hubinet_ops_approve:
    url: !secret hubinet_ops_approve_url
    method: POST
    headers: *hubinet_auth_headers
    payload: >-
      {"plan_id": "{{ plan_id }}"}
    timeout: 20

  hubinet_ops_reject:
    url: !secret hubinet_ops_reject_url
    method: POST
    headers: *hubinet_auth_headers
    payload: >-
      {"plan_id": "{{ plan_id }}"}
    timeout: 20

script:
  hubinet_ops_scan_container:
    alias: "Hubinet Ops - scan container"
    mode: parallel
    fields: &vmid_field
      vmid:
        required: true
        selector:
          number:
            min: 1
            max: 999999
    sequence:
      - action: rest_command.hubinet_ops_scan_container
        data:
          vmid: "{{ vmid | int }}"

  hubinet_ops_refresh_container:
    alias: "Hubinet Ops - refresh container"
    mode: parallel
    fields: *vmid_field
    sequence:
      - action: rest_command.hubinet_ops_refresh_container
        data:
          vmid: "{{ vmid | int }}"

  hubinet_ops_retry_healthcheck:
    alias: "Hubinet Ops - retry healthcheck"
    mode: parallel
    fields: *vmid_field
    sequence:
      - action: rest_command.hubinet_ops_retry_healthcheck
        data:
          vmid: "{{ vmid | int }}"

  hubinet_ops_rollback:
    alias: "Hubinet Ops - rollback"
    mode: single
    fields: *vmid_field
    sequence:
      - action: rest_command.hubinet_ops_rollback
        data:
          vmid: "{{ vmid | int }}"

  hubinet_ops_approve_container:
    alias: "Hubinet Ops - approve plan"
    mode: parallel
    fields: *vmid_field
    variables:
      state_entity: "sensor.hubinet_ops_ct{{ vmid | int }}_health_status"
      plan_id: "{{ state_attr(state_entity, 'active_plan_id') }}"
    sequence:
      - condition: template
        value_template: "{{ plan_id not in [none, '', 'None'] }}"
      - action: rest_command.hubinet_ops_approve
        data:
          plan_id: "{{ plan_id }}"

  hubinet_ops_reject_container:
    alias: "Hubinet Ops - reject plan"
    mode: parallel
    fields: *vmid_field
    variables:
      state_entity: "sensor.hubinet_ops_ct{{ vmid | int }}_health_status"
      plan_id: "{{ state_attr(state_entity, 'active_plan_id') }}"
    sequence:
      - condition: template
        value_template: "{{ plan_id not in [none, '', 'None'] }}"
      - action: rest_command.hubinet_ops_reject
        data:
          plan_id: "{{ plan_id }}"

automation:
  - id: hubinet_ops_webhook_v021
    alias: "Hubinet Ops 0.2.1 - agent notifications"
    mode: queued
    max: 20
    triggers:
      - trigger: webhook
        webhook_id: !secret hubinet_ops_webhook_id
        allowed_methods:
          - POST
        local_only: true
    variables:
      event_type: "{{ trigger.json.event_type | default('unknown') }}"
      container: "{{ trigger.json.container | default('unknown service') }}"
      vmid: "{{ trigger.json.vmid | default('?') }}"
      dashboard_path: "{{ trigger.json.dashboard_path | default('/hubinet-ops/overview') }}"
    actions:
      - choose:
          - conditions: "{{ event_type == 'approval_required' }}"
            sequence:
              - action: notify.mobile_app_poco_x8
                data:
                  title: "CT{{ vmid }} {{ container }}: approval required"
                  message: "{{ trigger.json.pending_count }} updates, {{ trigger.json.risk }} risk. Open Hubinet Ops to review."
                  data: &navigation_data
                    url: "{{ dashboard_path }}"
                    clickAction: "{{ dashboard_path }}"
          - conditions: "{{ event_type == 'job_success' }}"
            sequence:
              - action: notify.mobile_app_poco_x8
                data:
                  title: "CT{{ vmid }} {{ container }}: update successful"
                  message: "Health stabilization passed."
                  data: *navigation_data
          - conditions: "{{ event_type == 'job_rolled_back' }}"
            sequence:
              - action: notify.mobile_app_poco_x8
                data:
                  title: "CT{{ vmid }} {{ container }}: rollback successful"
                  message: "The snapshot was restored and stabilization passed."
                  data: *navigation_data
          - conditions: "{{ event_type in ['manual_intervention_required', 'job_blocked', 'scan_failed'] }}"
            sequence:
              - action: notify.mobile_app_poco_x8
                data:
                  title: "CT{{ vmid }} {{ container }}: attention required"
                  message: "Open Hubinet Ops for the current state and recent events."
                  data: *navigation_data
