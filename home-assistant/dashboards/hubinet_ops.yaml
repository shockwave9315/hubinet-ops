title: Hubinet Ops
views:
- title: Centrum
  path: overview
  icon: mdi:server-network
  type: sections
  max_columns: 4
  sections:
  - type: grid
    cards:
    - type: custom:mushroom-title-card
      title: Hubinet Ops
      subtitle: Pełne inventory Proxmox · backend jest źródłem prawdy
    - type: custom:mushroom-chips-card
      alignment: justify
      chips:
      - type: template
        entity: sensor.hubinet_ops_agent_availability
        icon: mdi:mqtt
        content: '{{ states(entity) }}'
        icon_color: '{{ ''green'' if is_state(entity, ''online'') else ''red'' }}'
        tap_action:
          action: more-info
      - type: template
        entity: sensor.hubinet_ops_agent_version
        icon: mdi:tag-outline
        content: '{{ states(entity) }}'
        icon_color: blue
        tap_action:
          action: more-info
      - type: template
