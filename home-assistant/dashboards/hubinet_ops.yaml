          else ''amber'' }}'
        tap_action:
          action: more-info
      - type: template
        entity: sensor.hubinet_ops_ct110_service_status
        icon: mdi:application-cog
        content: '{{ states(entity) }}'
        icon_color: '{{ ''green'' if is_state(entity, ''active'') else ''red'' }}'
        tap_action:
          action: more-info
      - type: template
        entity: sensor.hubinet_ops_ct110_api_health
        icon: mdi:api
        content: '{{ states(entity) }}'
