- title: VM100
  path: vm-100
  icon: mdi:home-assistant
  type: sections
  max_columns: 4
  sections:
  - type: grid
    cards:
    - type: custom:mushroom-title-card
      title: VM100 · Home Assistant
      subtitle: HAOS · obserwacja QEMU
    - type: custom:mushroom-template-card
      entity: sensor.hubinet_ops_vm100_health_status
      primary: VM100 · Home Assistant
      secondary: 'Runtime: {{ states(''sensor.hubinet_ops_vm100_runtime_status'') }} · Guest Agent: {{ states(''sensor.hubinet_ops_vm100_guest_agent'')
        }}'
      multiline_secondary: true
      icon: mdi:home-assistant
      color: '{% set health = states(entity) %} {{ ''green'' if health == ''healthy'' else ''amber'' if health == ''degraded''
        else ''red'' }}'
      badge_icon: '{{ ''mdi:check-circle'' if is_state(entity, ''healthy'') else ''mdi:alert-circle'' }}'
      badge_color: '{{ ''green'' if is_state(entity, ''healthy'') else ''amber'' if is_state(entity, ''degraded'') else ''red''
        }}'
      tap_action:
        action: more-info
    - type: custom:mushroom-chips-card
      alignment: justify
      chips:
      - type: template
        entity: sensor.hubinet_ops_vm100_health_status
        icon: mdi:heart-pulse
        content: '{{ states(entity) }}'
        icon_color: '{% set value = states(entity) %} {{ ''green'' if value == ''healthy'' else ''amber'' if value == ''degraded''
          else ''red'' if value in [''critical'', ''offline''] else ''grey'' }}'
        tap_action:
          action: more-info
      - type: template
        entity: sensor.hubinet_ops_vm100_health_score
        icon: mdi:heart-pulse
        content: '{{ states(entity) }}%'
        icon_color: '{% set value = states(entity) | int(-1) %} {{ ''green'' if value >= 90 else ''amber'' if value >= 70
          else ''red'' }}'
        tap_action:
          action: more-info
      - type: template
        entity: sensor.hubinet_ops_vm100_runtime_status
        icon: mdi:server
        content: '{{ states(entity) }}'
        icon_color: '{% set value = states(entity) %} {{ ''green'' if value == ''running'' else ''grey'' if value == ''stopped''
          else ''amber'' }}'
        tap_action:
          action: more-info
      - type: template
        entity: sensor.hubinet_ops_vm100_guest_agent
        icon: mdi:lan-connect
        content: '{{ states(entity) }}'
        icon_color: '{% set value = states(entity) %} {{ ''green'' if value == ''available'' else ''red'' if value == ''unavailable''
          else ''amber'' }}'
        tap_action:
          action: more-info
  - type: grid
    cards:
    - type: custom:mushroom-title-card
      title: Sterowanie
