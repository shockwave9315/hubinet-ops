title: Hubinet Ops
views:
  - title: Overview
    path: overview
    icon: mdi:server-network
    cards:
      - type: entities
        title: Hubinet Ops Agent
        show_header_toggle: false
        entities:
          - entity: sensor.hubinet_ops_agent_availability
            name: Availability
          - entity: sensor.hubinet_ops_agent_version
            name: Version
          - entity: sensor.hubinet_ops_agent_configured_container_count
            name: Configured containers
          - entity: sensor.hubinet_ops_agent_active_job_count
            name: Active jobs
          - entity: sensor.hubinet_ops_agent_last_refresh
            name: Last refresh
      - type: glance
        title: Managed containers
        columns: 2
        entities:
          - entity: sensor.hubinet_ops_ct101_health_status
            name: CT101
            tap_action:
              action: navigate
              navigation_path: /hubinet-ops/ct-101
          - entity: sensor.hubinet_ops_ct106_health_status
            name: CT106
            tap_action:
              action: navigate
              navigation_path: /hubinet-ops/ct-106
      - type: entities
        title: Operations
        entities:
          - entity: sensor.hubinet_ops_ct101_operation_status
            name: CT101 operation
          - entity: sensor.hubinet_ops_ct101_job_progress
            name: CT101 progress
          - entity: sensor.hubinet_ops_ct106_operation_status
            name: CT106 operation
          - entity: sensor.hubinet_ops_ct106_job_progress
            name: CT106 progress

  - title: CT101
    path: ct-101
    icon: mdi:server
    cards:
      - type: entities
        title: CT101 cloudflared
        show_header_toggle: false
        entities:
          - sensor.hubinet_ops_ct101_health_status
          - sensor.hubinet_ops_ct101_health_score
          - sensor.hubinet_ops_ct101_lxc_status
          - sensor.hubinet_ops_ct101_update_status
          - sensor.hubinet_ops_ct101_operation_status
          - sensor.hubinet_ops_ct101_last_operation_result
          - sensor.hubinet_ops_ct101_job_stage
          - sensor.hubinet_ops_ct101_job_progress
          - sensor.hubinet_ops_ct101_pending_updates
          - sensor.hubinet_ops_ct101_risk
          - sensor.hubinet_ops_ct101_disk_used
          - sensor.hubinet_ops_ct101_disk_free
          - sensor.hubinet_ops_ct101_memory_used
          - sensor.hubinet_ops_ct101_docker_required_healthy
          - sensor.hubinet_ops_ct101_docker_required_total
          - sensor.hubinet_ops_ct101_active_plan_id
          - sensor.hubinet_ops_ct101_active_job_id
          - sensor.hubinet_ops_ct101_last_error
      - type: horizontal-stack
        cards:
          - type: button
            name: Scan
            icon: mdi:magnify
            tap_action:
              action: call-service
              service: script.hubinet_ops_scan_container
              data:
                vmid: 101
              confirmation:
                text: Scan CT101 for package updates?
          - type: button
            name: Refresh
            icon: mdi:refresh
            tap_action:
              action: call-service
              service: script.hubinet_ops_refresh_container
              data:
                vmid: 101
      - type: conditional
        conditions:
          - entity: sensor.hubinet_ops_ct101_operation_status
            state: waiting_approval
        card:
          type: horizontal-stack
          cards:
            - type: button
              name: Approve update
              icon: mdi:check-decagram
              tap_action:
                action: call-service
                service: script.hubinet_ops_approve_container
                data:
                  vmid: 101
                confirmation:
                  text: Approve the current CT101 update plan?
            - type: button
              name: Reject plan
              icon: mdi:close-circle-outline
              tap_action:
                action: call-service
                service: script.hubinet_ops_reject_container
                data:
                  vmid: 101
                confirmation:
                  text: Reject the current CT101 update plan?
      - type: conditional
        conditions:
          - entity: sensor.hubinet_ops_ct101_health_status
            state: critical
        card:
          type: button
          name: Retry healthcheck
          icon: mdi:heart-pulse
          tap_action:
            action: call-service
            service: script.hubinet_ops_retry_healthcheck
            data:
              vmid: 101
            confirmation:
              text: Retry the stabilized CT101 healthcheck?
      - type: conditional
        conditions:
          - entity: sensor.hubinet_ops_ct101_operation_status
            state: manual_intervention
          - entity: sensor.hubinet_ops_ct101_rollback_allowed
            state: allowed
        card:
          type: button
          name: Rollback
          icon: mdi:backup-restore
          tap_action:
            action: call-service
            service: script.hubinet_ops_rollback
            data:
              vmid: 101
            confirmation:
              text: Restore the recorded CT101 snapshot?
      - type: markdown
        title: Recent live job events
        content: >-
          {% set events = state_attr('sensor.hubinet_ops_ct101_health_status', 'recent_job_events') or [] %}
          {% for event in events[-20:] %}
          `{{ event.created_at | default('') }}` **{{ event.stage | default('idle') }}** {{ event.progress | default(0) }}% `{{ event.level | default('info') }}` {{ event.message | default('') }}

          {% else %}No job events.{% endfor %}
      - type: markdown
        title: Pending packages
        content: >-
          {% set updates = state_attr('sensor.hubinet_ops_ct101_health_status', 'updates') or {} %}
          {% for package in (updates.get('packages', []))[:200] %}
          - `{{ package.name }}` {{ package.current | default('?') }} -> {{ package.target | default('?') }}
          {% else %}No pending packages.{% endfor %}

