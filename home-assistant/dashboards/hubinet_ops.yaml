        icon_color: blue
      - type: custom:mushroom-entity-card
        entity: sensor.hubinet_ops_vm100_disk_total
        name: Dysk łącznie
        icon: mdi:harddisk
        icon_color: blue
      - type: custom:mushroom-entity-card
        entity: sensor.hubinet_ops_vm100_network_received
        name: Sieć odebrana
        icon: mdi:download-network
        icon_color: cyan
      - type: custom:mushroom-entity-card
        entity: sensor.hubinet_ops_vm100_network_sent
        name: Sieć wysłana
        icon: mdi:upload-network
        icon_color: cyan
  - type: grid
    cards:
    - type: custom:mushroom-title-card
      title: QEMU Guest Agent
      subtitle: Adres główny nie przekracza limitu stanu HA
    - type: grid
      columns: 2
      square: false
      cards:
      - type: custom:mushroom-entity-card
        entity: sensor.hubinet_ops_vm100_qemu_status
        name: Status QEMU
        icon: mdi:monitor
        icon_color: blue
      - type: custom:mushroom-entity-card
        entity: sensor.hubinet_ops_vm100_guest_agent
        name: Guest Agent
        icon: mdi:lan-connect
        icon_color: green
      - type: custom:mushroom-entity-card
        entity: sensor.hubinet_ops_vm100_ip_addresses
        name: Primary IP
        icon: mdi:ip-network
        icon_color: cyan
      - type: custom:mushroom-template-card
        entity: sensor.hubinet_ops_vm100_uptime
        primary: Uptime
        secondary: '{% set seconds = states(entity) | int(0) %}{% set days = seconds // 86400 %}{% set hours = (seconds %
          86400) // 3600 %}{% set minutes = (seconds % 3600) // 60 %}{{ days }} d {{ hours }} h {{ minutes }} min'
        icon: mdi:timer-outline
        color: green
        tap_action:
          action: more-info
      - type: custom:mushroom-template-card
        entity: sensor.hubinet_ops_vm100_last_refresh
        primary: Ostatnie odświeżenie
        secondary: '{% set value = states(entity) %}{% if value in [''unknown'', ''unavailable'', ''none'', ''None'', '''']
          %}Brak danych{% else %}{% set stamp = as_timestamp(value, none) %}{{ stamp | timestamp_custom(''%d.%m.%Y %H:%M'',
          true) if stamp is not none else ''Nieprawidłowa data'' }}{% endif %}'
        icon: mdi:refresh
        color: blue-grey
        tap_action:
          action: more-info
- title: CT101
  path: ct-101
  icon: mdi:cloud-lock-outline
  type: sections
  max_columns: 4
  sections:
  - type: grid
    cards:
    - type: custom:mushroom-title-card
      title: Status
      subtitle: CT101 · Cloudflared · Adapter APT · high
    - type: custom:mushroom-template-card
      entity: sensor.hubinet_ops_ct101_health_status
      primary: CT101 · Cloudflared
      secondary: 'Runtime: {{ states(''sensor.hubinet_ops_ct101_runtime_status'') }} · aktualizacje: {{ states(''sensor.hubinet_ops_ct101_update_status'')
        }} · pakiety: {{ states(''sensor.hubinet_ops_ct101_pending_update_count'') }}'
      multiline_secondary: true
      icon: mdi:cloud-lock-outline
      color: '{% set health = states(entity) %} {{ ''green'' if health == ''healthy'' else ''amber'' if health == ''degraded''
        else ''red'' }}'
      badge_icon: '{{ ''mdi:check-circle'' if is_state(entity, ''healthy'') else ''mdi:alert-circle'' }}'
      badge_color: '{{ ''green'' if is_state(entity, ''healthy'') else ''amber'' if is_state(entity, ''degraded'') else ''red''
        }}'
      tap_action:
        action: more-info
    - type: custom:mushroom-chips-card
      alignment: justify
      chips:
      - type: template
        entity: sensor.hubinet_ops_ct101_health_status
        icon: mdi:heart-pulse
        content: '{{ states(entity) }}'
        icon_color: '{% set value = states(entity) %} {{ ''green'' if value == ''healthy'' else ''amber'' if value == ''degraded''
          else ''red'' if value in [''critical'', ''offline''] else ''grey'' }}'
        tap_action:
          action: more-info
      - type: template
        entity: sensor.hubinet_ops_ct101_health_score
        icon: mdi:heart-pulse
        content: '{{ states(entity) }}%'
        icon_color: '{% set value = states(entity) | int(-1) %} {{ ''green'' if value >= 90 else ''amber'' if value >= 70
          else ''red'' }}'
        tap_action:
          action: more-info
      - type: template
        entity: sensor.hubinet_ops_ct101_runtime_status
        icon: mdi:server
        content: '{{ states(entity) }}'
        icon_color: '{% set value = states(entity) %} {{ ''green'' if value == ''running'' else ''grey'' if value == ''stopped''
          else ''amber'' }}'
        tap_action:
          action: more-info
      - type: template
        entity: sensor.hubinet_ops_ct101_update_status
        icon: mdi:package-up
        content: '{{ states(entity) }}'
        icon_color: '{% set value = states(entity) %} {{ ''green'' if value == ''up_to_date'' else ''blue'' if value == ''scanning''
          else ''amber'' if value == ''update_available'' else ''grey'' }}'
        tap_action:
          action: more-info
      - type: template
        entity: sensor.hubinet_ops_ct101_operation_status
        icon: mdi:progress-wrench
        content: '{{ states(entity) }}'
        icon_color: '{% set value = states(entity) %} {{ ''green'' if value in [''idle'', ''success''] else ''blue'' if value
          == ''running'' else ''amber'' if value in [''waiting_approval'', ''rolled_back''] else ''red'' }}'
        tap_action:
          action: more-info
      - type: template
        entity: sensor.hubinet_ops_ct101_risk
        icon: mdi:shield-alert-outline
        content: '{{ states(entity) }}'
        icon_color: '{% set value = states(entity) %} {{ ''green'' if value in [''none'', ''low''] else ''amber'' if value
          == ''medium'' else ''red'' }}'
        tap_action:
          action: more-info
      - type: template
        entity: sensor.hubinet_ops_ct101_pending_update_count
        icon: mdi:format-list-numbered
        content: '{{ states(entity) }} pak.'
        icon_color: '{% set value = states(entity) | int(-1) %} {{ ''green'' if value == 0 else ''amber'' if value > 0 else
          ''grey'' }}'
        tap_action:
          action: more-info
  - type: grid
    cards:
    - type: custom:mushroom-title-card
      title: Sterowanie
      subtitle: Każda akcja wymaga potwierdzenia
    - type: grid
      columns: 2
      square: false
      cards:
      - type: conditional
        conditions:
        - condition: state
          entity: sensor.hubinet_ops_ct101_runtime_status
          state: stopped
        - condition: state
          entity: sensor.hubinet_ops_ct101_capability_start
          state: allowed
        - condition: state
          entity: sensor.hubinet_ops_ct101_operation_status
          state_not: waiting_approval
        - condition: state
          entity: sensor.hubinet_ops_ct101_active_job_id
          state: none
        - condition: state
          entity: sensor.hubinet_ops_ct101_lifecycle_status
          state_not: running
        - condition: state
          entity: sensor.hubinet_ops_ct101_operation_status
          state_not: running
        card:
          type: custom:mushroom-template-card
          primary: Uruchom
          secondary: Start CT101
          icon: mdi:play
          color: green
          tap_action:
            action: perform-action
            perform_action: script.hubinet_ops_start_container
            data:
              vmid: 101
            confirmation:
              title: Uruchom CT101
              text: Uruchomić kontener CT101?
              confirm_text: Uruchom CT101
              dismiss_text: Anuluj
      - type: conditional
        conditions:
