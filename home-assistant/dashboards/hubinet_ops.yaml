      - sensor.hubinet_ops_ct101_active_job_id
      - sensor.hubinet_ops_ct101_last_scan
      - sensor.hubinet_ops_ct101_last_update
      - sensor.hubinet_ops_ct101_last_operation_result
      - sensor.hubinet_ops_ct101_rollback_allowed
    - type: entities
      title: Weryfikacja końcowa
      entities:
      - sensor.hubinet_ops_ct101_update_status
      - sensor.hubinet_ops_ct101_pending_update_count
      - sensor.hubinet_ops_ct101_verification_status
      - sensor.hubinet_ops_ct101_apt_check_ok
      - sensor.hubinet_ops_ct101_dpkg_audit_ok
      - sensor.hubinet_ops_ct101_reboot_required
      - sensor.hubinet_ops_ct101_packages_remaining_count
    - type: entities
      title: Recovery scan
      entities:
      - sensor.hubinet_ops_ct101_recovery_scan_status
      - sensor.hubinet_ops_ct101_last_recovery_scan
      - sensor.hubinet_ops_ct101_last_recovery_scan_result
    - type: markdown
      title: Pakiety APT
      content: '{% set updates = state_attr(''sensor.hubinet_ops_ct101_health_status'', ''updates'') or {} %}

        {% set packages = updates.get(''packages'', []) %}

        {% set meta = state_attr(''sensor.hubinet_ops_ct101_health_status'', ''attribute_payload'') or {} %}

        {% set total = meta.get(''packages_total'', packages | count) %}

        {% set visible = packages | count %}

        **Łącznie: {{ total }} · widoczne: {{ visible }}**


        {% for package in packages[:30] %}- `{{ package.get(''name'', ''?'') }}`

        {% endfor %}{% if visible > 30 %}

        … {{ visible - 30 }} kolejnych widocznych pakietów.

        {% endif %}{% if meta.get(''truncated'') %}

        Podgląd ogranicza limit atrybutów 10 KB.

        {% endif %}'
    - type: markdown
      title: Logi live
      content: '{% set events = state_attr(''sensor.hubinet_ops_ct101_health_status'', ''recent_job_events'') or [] %}

        {% for event in events[-25:] | reverse %}- `{{ event.get(''created_at'', '''') }}` **{{ event.get(''stage'', '''')
        }}** {{ event.get(''message'', '''') | replace(''|'', ''¦'') }}

        {% endfor %}'
    - type: markdown
      title: Tryb obserwacji
      content: Tryb obserwacji — sterowanie zablokowane przez politykę backendu.
