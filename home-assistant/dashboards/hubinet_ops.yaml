        icon: mdi:server-network
        content: '{{ states(entity) }} zasobów'
        icon_color: blue
        tap_action:
          action: more-info
      - type: template
        entity: sensor.hubinet_ops_agent_active_job_count
        icon: mdi:progress-wrench
        content: '{{ states(entity) }} zadań'
        icon_color: '{% set value = states(entity) | int(-1) %} {{ ''green'' if value == 0 else ''amber'' if value > 0 else
          ''grey'' }}'
        tap_action:
          action: more-info
      - type: template
        entity: sensor.hubinet_ops_agent_last_refresh
        icon: mdi:clock-outline
        content: '{{ relative_time(states(entity) | as_datetime) if states(entity) not in [''unknown'', ''unavailable''] else
          ''brak'' }}'
        icon_color: blue-grey
        tap_action:
          action: more-info
  - type: grid
    cards:
    - type: custom:mushroom-title-card
      title: Zasoby
      subtitle: VM100–CT103
    - type: custom:mushroom-template-card
      entity: sensor.hubinet_ops_vm100_health_status
