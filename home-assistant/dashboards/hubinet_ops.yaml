title: Hubinet Ops
views:
- title: Centrum
  path: overview
  icon: mdi:server-network
  type: sections
  max_columns: 4
  sections:
  - type: grid
    cards:
    - type: custom:mushroom-title-card
      title: Hubinet Ops
      subtitle: Pełne inventory Proxmox · backend jest źródłem prawdy
    - type: entities
      title: Agent
      entities:
      - sensor.hubinet_ops_agent_availability
      - sensor.hubinet_ops_agent_version
      - sensor.hubinet_ops_agent_configured_resource_count
      - sensor.hubinet_ops_agent_configured_lxc_count
      - sensor.hubinet_ops_agent_configured_qemu_count
      - sensor.hubinet_ops_agent_active_job_count
    - type: custom:mushroom-template-card
      entity: sensor.hubinet_ops_vm100_health_status
      primary: VM100 · Home Assistant
      secondary: 'Zdrowie: {{ states(entity) }} · status: {{ states(''sensor.hubinet_ops_vm100_runtime_status'') }}'
      multiline_secondary: true
      icon: mdi:home-assistant
      color: '{% set health = states(entity) %} {{ ''green'' if health == ''healthy'' else ''amber'' if health == ''degraded''
        else ''red'' }}'
      tap_action:
        action: navigate
