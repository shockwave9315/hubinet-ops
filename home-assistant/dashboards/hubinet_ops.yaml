title: Hubinet Ops
views:
  - title: Centrum
    path: overview
    icon: mdi:server-network
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: Hubinet Ops
            subtitle: Bezpieczne aktualizacje kontenerów Proxmox
          - type: custom:mushroom-chips-card
            alignment: start
            chips:
              - type: template
                icon: mdi:lan-connect
                content: "{{ states('sensor.hubinet_ops_agent_availability') }}"
                icon_color: >-
                  {{ 'green' if is_state('sensor.hubinet_ops_agent_availability', 'online') else 'red' }}
                tap_action:
                  action: more-info
                  entity: sensor.hubinet_ops_agent_availability
              - type: template
                icon: mdi:tag-outline
                content: "v{{ states('sensor.hubinet_ops_agent_version') }}"
                icon_color: blue
                tap_action:
                  action: more-info
                  entity: sensor.hubinet_ops_agent_version
              - type: template
                icon: mdi:progress-wrench
                content: "{{ states('sensor.hubinet_ops_agent_active_job_count') }} aktywnych"
                icon_color: >-
                  {{ 'amber' if states('sensor.hubinet_ops_agent_active_job_count') | int(0) > 0 else 'green' }}
                tap_action:
                  action: more-info
                  entity: sensor.hubinet_ops_agent_active_job_count
              - type: template
                icon: mdi:clock-outline
                content: >-
                  {% set value = states('sensor.hubinet_ops_agent_last_refresh') %}
                  {{ relative_time(as_datetime(value)) if value not in ['unknown', 'unavailable', 'none', 'None', ''] else 'brak odświeżenia' }}
                icon_color: blue-grey
          - type: custom:mushroom-template-card
            entity: sensor.hubinet_ops_agent_availability
            primary: Agent Hubinet Ops
            secondary: >-
              MQTT: {{ states(entity) }} · wersja {{ states('sensor.hubinet_ops_agent_version') }}
              · kontenery {{ states('sensor.hubinet_ops_agent_configured_container_count') }}
            multiline_secondary: true
            icon: mdi:shield-crown-outline
            color: >-
              {{ 'green' if is_state(entity, 'online') else 'red' }}
            badge_icon: >-
              {{ 'mdi:check-circle' if is_state(entity, 'online') else 'mdi:alert-circle' }}
            badge_color: >-
              {{ 'green' if is_state(entity, 'online') else 'red' }}
            tap_action:
              action: more-info

      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: Kontenery
            subtitle: Dotknij kafla, aby przejść do szczegółów
          - type: custom:mushroom-template-card
            entity: sensor.hubinet_ops_ct101_health_status
            primary: CT101 · Cloudflared
            secondary: >-
              Zdrowie: {{ states(entity) }} · aktualizacje: {{ states('sensor.hubinet_ops_ct101_update_status') }}
              · operacja: {{ states('sensor.hubinet_ops_ct101_operation_status') }}
              · pakiety: {{ states('sensor.hubinet_ops_ct101_pending_update_count') }}
            multiline_secondary: true
            icon: mdi:cloud-lock-outline
            color: >-
              {% set health = states(entity) %}
              {{ 'green' if health == 'healthy' else 'amber' if health == 'degraded' else 'red' }}
            badge_icon: >-
              {% set op = states('sensor.hubinet_ops_ct101_operation_status') %}
              {{ 'mdi:progress-wrench' if op == 'running' else 'mdi:clock-alert-outline' if op == 'waiting_approval' else 'mdi:check-circle-outline' }}
            badge_color: >-
              {% set op = states('sensor.hubinet_ops_ct101_operation_status') %}
              {{ 'blue' if op == 'running' else 'amber' if op == 'waiting_approval' else 'green' }}
            tap_action:
              action: navigate
              navigation_path: /hubinet-ops/ct-101
          - type: custom:mushroom-template-card
            entity: sensor.hubinet_ops_ct106_health_status
            primary: CT106 · WeatherHub
            secondary: >-
              Zdrowie: {{ states(entity) }} · aktualizacje: {{ states('sensor.hubinet_ops_ct106_update_status') }}
              · operacja: {{ states('sensor.hubinet_ops_ct106_operation_status') }}
              · Docker: {{ states('sensor.hubinet_ops_ct106_docker_required_healthy') }}/{{ states('sensor.hubinet_ops_ct106_docker_required_total') }}
            multiline_secondary: true
            icon: mdi:docker
            color: >-
              {% set health = states(entity) %}
              {{ 'green' if health == 'healthy' else 'amber' if health == 'degraded' else 'red' }}
            badge_icon: >-
              {% set op = states('sensor.hubinet_ops_ct106_operation_status') %}
              {{ 'mdi:progress-wrench' if op == 'running' else 'mdi:clock-alert-outline' if op == 'waiting_approval' else 'mdi:check-circle-outline' }}
            badge_color: >-
              {% set op = states('sensor.hubinet_ops_ct106_operation_status') %}
              {{ 'blue' if op == 'running' else 'amber' if op == 'waiting_approval' else 'green' }}
            tap_action:
              action: navigate
              navigation_path: /hubinet-ops/ct-106

      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: Operacje
            subtitle: Bieżący etap i postęp
          - type: custom:mushroom-template-card
            entity: sensor.hubinet_ops_ct101_operation_status
            primary: "CT101 · {{ states(entity) | replace('_', ' ') }}"
            secondary: >-
              Etap {{ states('sensor.hubinet_ops_ct101_job_stage') }} · {{ states('sensor.hubinet_ops_ct101_job_progress') }}%
              {% set event = state_attr('sensor.hubinet_ops_ct101_health_status', 'last_job_event') or {} %}
              {% if event.get('message') %}· {{ event.get('message') }}{% endif %}
            multiline_secondary: true
            icon: mdi:cloud-sync-outline
            color: >-
              {% set op = states(entity) %}
              {{ 'blue' if op == 'running' else 'amber' if op == 'waiting_approval' else 'red' if op in ['failed', 'manual_intervention'] else 'green' }}
            badge_text: "{{ states('sensor.hubinet_ops_ct101_job_progress') }}%"
            badge_color: >-
              {{ 'blue' if is_state(entity, 'running') else 'grey' }}
            tap_action:
              action: navigate
              navigation_path: /hubinet-ops/ct-101
          - type: custom:mushroom-template-card
            entity: sensor.hubinet_ops_ct106_operation_status
            primary: "CT106 · {{ states(entity) | replace('_', ' ') }}"
            secondary: >-
              Etap {{ states('sensor.hubinet_ops_ct106_job_stage') }} · {{ states('sensor.hubinet_ops_ct106_job_progress') }}%
              {% set event = state_attr('sensor.hubinet_ops_ct106_health_status', 'last_job_event') or {} %}
              {% if event.get('message') %}· {{ event.get('message') }}{% endif %}
            multiline_secondary: true
            icon: mdi:docker
            color: >-
              {% set op = states(entity) %}
              {{ 'blue' if op == 'running' else 'amber' if op == 'waiting_approval' else 'red' if op in ['failed', 'manual_intervention'] else 'green' }}
            badge_text: "{{ states('sensor.hubinet_ops_ct106_job_progress') }}%"
            badge_color: >-
              {{ 'blue' if is_state(entity, 'running') else 'grey' }}
            tap_action:
              action: navigate
              navigation_path: /hubinet-ops/ct-106

  - title: CT101
    path: ct-101
    icon: mdi:cloud-lock-outline
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: CT101 · Cloudflared
            subtitle: Tunel Cloudflare · Debian 12
          - type: custom:mushroom-template-card
            entity: sensor.hubinet_ops_ct101_health_status
            primary: >-
              {{ 'Wszystko działa' if is_state(entity, 'healthy') else 'Kontener wymaga uwagi' }}
            secondary: >-
              LXC {{ states('sensor.hubinet_ops_ct101_lxc_status') }}
              · wynik {{ states('sensor.hubinet_ops_ct101_last_operation_result') }}
            multiline_secondary: true
            icon: mdi:cloud-lock-outline
            color: >-
              {% set health = states(entity) %}
              {{ 'green' if health == 'healthy' else 'amber' if health == 'degraded' else 'red' }}
            badge_icon: >-
              {{ 'mdi:check-circle' if is_state(entity, 'healthy') else 'mdi:alert-circle' }}
            badge_color: >-
              {{ 'green' if is_state(entity, 'healthy') else 'red' }}
            tap_action:
              action: more-info
          - type: custom:mushroom-chips-card
            alignment: justify
            chips:
              - type: template
                icon: mdi:heart-pulse
                content: "{{ states('sensor.hubinet_ops_ct101_health_score') }}%"
                icon_color: green
                tap_action:
                  action: more-info
                  entity: sensor.hubinet_ops_ct101_health_score
              - type: template
                icon: mdi:package-up
                content: "{{ states('sensor.hubinet_ops_ct101_pending_update_count') }} pak."
                icon_color: >-
                  {{ 'amber' if states('sensor.hubinet_ops_ct101_pending_update_count') | int(0) > 0 else 'green' }}
                tap_action:
                  action: more-info
                  entity: sensor.hubinet_ops_ct101_pending_update_count
              - type: template
                icon: mdi:shield-alert-outline
                content: "{{ states('sensor.hubinet_ops_ct101_risk') }}"
                icon_color: >-
                  {% set risk = states('sensor.hubinet_ops_ct101_risk') %}
                  {{ 'red' if risk == 'high' else 'amber' if risk == 'medium' else 'green' }}
                tap_action:
                  action: more-info
                  entity: sensor.hubinet_ops_ct101_risk
              - type: template
                icon: mdi:progress-wrench
                content: "{{ states('sensor.hubinet_ops_ct101_operation_status') }}"
                icon_color: >-
                  {{ 'blue' if is_state('sensor.hubinet_ops_ct101_operation_status', 'running') else 'amber' if is_state('sensor.hubinet_ops_ct101_operation_status', 'waiting_approval') else 'green' }}
                tap_action:
                  action: more-info
                  entity: sensor.hubinet_ops_ct101_operation_status

      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: Zasoby
            subtitle: Ostatni pomiar z kontenera
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-entity-card
                entity: sensor.hubinet_ops_ct101_disk_used
                name: Dysk zajęty
                icon: mdi:harddisk
                icon_color: blue
              - type: custom:mushroom-entity-card
                entity: sensor.hubinet_ops_ct101_disk_free
                name: Wolne miejsce
                icon: mdi:database-arrow-down-outline
                icon_color: cyan
              - type: custom:mushroom-entity-card
                entity: sensor.hubinet_ops_ct101_memory_used
                name: Pamięć RAM
                icon: mdi:memory
                icon_color: purple
              - type: custom:mushroom-entity-card
                entity: sensor.hubinet_ops_ct101_lxc_status
                name: Status LXC
                icon: mdi:server
                icon_color: green

      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: Sterowanie
            subtitle: Tryb obserwacji
          - type: custom:mushroom-template-card
            entity: sensor.hubinet_ops_ct101_health_status
            primary: Tryb obserwacji — sterowanie zablokowane przez politykę backendu
            secondary: Telemetria, zasoby, health, aktualizacje i historia pozostają dostępne.
            multiline_secondary: true
            icon: mdi:eye-lock-outline
            color: blue-grey
            tap_action:
              action: more-info

      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: Aktualna operacja
            subtitle: MQTT aktualizuje etap, postęp i logi na żywo
          - type: custom:mushroom-template-card
            entity: sensor.hubinet_ops_ct101_operation_status
            primary: >-
              {{ states(entity) | replace('_', ' ') | title }}
            secondary: >-
              Etap: {{ states('sensor.hubinet_ops_ct101_job_stage') }}
              · postęp: {{ states('sensor.hubinet_ops_ct101_job_progress') }}%
              {% set event = state_attr('sensor.hubinet_ops_ct101_health_status', 'last_job_event') or {} %}
              {% if event.get('message') %}· {{ event.get('message') }}{% endif %}
            multiline_secondary: true
            icon: >-
              {% set stage = states('sensor.hubinet_ops_ct101_job_stage') %}
              {{ 'mdi:package-up' if stage == 'updating' else 'mdi:backup-restore' if 'rollback' in stage else 'mdi:heart-pulse' if stage == 'healthcheck' else 'mdi:progress-wrench' }}
            color: >-
              {% set op = states(entity) %}
              {{ 'blue' if op == 'running' else 'amber' if op == 'waiting_approval' else 'red' if op in ['failed', 'manual_intervention'] else 'green' }}
            badge_text: "{{ states('sensor.hubinet_ops_ct101_job_progress') }}%"
            badge_color: >-
              {{ 'blue' if is_state(entity, 'running') else 'grey' }}
            tap_action:
              action: more-info
          - type: markdown
            title: Logi live
            entity_id:
              - sensor.hubinet_ops_ct101_health_status
              - sensor.hubinet_ops_ct101_job_progress
            card_size: 8
            content: >-
              {% set events = state_attr('sensor.hubinet_ops_ct101_health_status', 'recent_job_events') or [] %}
              {% set icons = {
                'preflight': '🧪', 'snapshot': '📸', 'updating': '📦',
                'waiting_services': '⏳', 'healthcheck': '❤️', 'repair': '🛠️',
                'rollback': '↩️', 'rollback_wait': '⏳', 'rollback_healthcheck': '❤️',
                'completed': '✅', 'failed': '❌'
              } %}
              {% if events %}
              | Czas | Etap | % | Zdarzenie |
              |:--|:--|--:|:--|
              {% for event in events[-25:] | reverse %}
              | `{{ as_timestamp(event.created_at, 0) | timestamp_custom('%H:%M:%S', true) }}` | {{ icons.get(event.stage, '•') }} **{{ event.stage | default('idle') }}** | **{{ event.progress | default(0) }}** | {{ event.message | default('') | replace('|', '¦') }} |
              {% endfor %}
              {% else %}
              Brak zdarzeń dla CT101. Pojawią się tutaj podczas skanu, aktualizacji, naprawy albo rollbacku.
              {% endif %}

      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: Pakiety
            subtitle: Plan zatwierdzany ręcznie
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: sensor.hubinet_ops_ct101_pending_update_count
                above: 0
            card:
              type: markdown
              entity_id:
                - sensor.hubinet_ops_ct101_health_status
                - sensor.hubinet_ops_ct101_pending_update_count
              card_size: 8
              content: >-
                {% set updates = state_attr('sensor.hubinet_ops_ct101_health_status', 'updates') or {} %}
                {% set packages = updates.get('packages', []) %}
                {% set meta = state_attr('sensor.hubinet_ops_ct101_health_status', 'attribute_payload') or {} %}
                {% set total = meta.get('packages_total', states('sensor.hubinet_ops_ct101_pending_update_count') | int(0)) | int(0) %}
                {% set visible = packages | count %}
                **{{ total }} pakietów · ryzyko {{ states('sensor.hubinet_ops_ct101_risk') }}**

                {% if meta.get('truncated') and visible < total %}
                _Podgląd MQTT zawiera {{ visible }} z {{ total }} pakietów (limit atrybutów 10 KB)._

                {% endif %}

                | Pakiet | Obecna | Docelowa |
                |:--|:--|:--|
                {% for package in packages[:30] %}
                | `{{ package.name }}` | `{{ package.current | default('?') }}` | `{{ package.target | default('?') }}` |
                {% endfor %}
                {% if visible > 30 %}

                _…oraz {{ visible - 30 }} kolejnych widocznych pakietów._
                {% endif %}
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: sensor.hubinet_ops_ct101_pending_update_count
                below: 1
            card:
              type: custom:mushroom-template-card
              primary: System aktualny
              secondary: Brak oczekujących pakietów
              icon: mdi:package-check
              color: green

      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: Historia i diagnostyka
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-entity-card
                entity: sensor.hubinet_ops_ct101_last_scan
                name: Ostatni skan
                icon: mdi:magnify-scan
                icon_color: blue
              - type: custom:mushroom-entity-card
                entity: sensor.hubinet_ops_ct101_last_update
                name: Ostatnia aktualizacja
                icon: mdi:update
                icon_color: green
              - type: custom:mushroom-entity-card
                entity: sensor.hubinet_ops_ct101_active_plan_id
                name: Aktywny plan
                icon: mdi:clipboard-text-clock-outline
                icon_color: amber
              - type: custom:mushroom-entity-card
                entity: sensor.hubinet_ops_ct101_active_job_id
                name: Aktywny job
                icon: mdi:identifier
                icon_color: blue
          - type: custom:mushroom-template-card
            entity: sensor.hubinet_ops_ct101_last_error
            primary: Ostatni błąd
            secondary: "{{ states(entity) }}"
            multiline_secondary: true
            icon: mdi:alert-circle-outline
            color: >-
              {{ 'green' if states(entity) in ['none', 'unknown', ''] else 'red' }}
            tap_action:
              action: more-info

  - title: CT106
    path: ct-106
    icon: mdi:docker
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: CT106 · WeatherHub
            subtitle: API, worker i Redis w Dockerze · Debian 13
          - type: custom:mushroom-template-card
            entity: sensor.hubinet_ops_ct106_health_status
            primary: >-
              {{ 'Wszystko działa' if is_state(entity, 'healthy') else 'Kontener wymaga uwagi' }}
            secondary: >-
              LXC {{ states('sensor.hubinet_ops_ct106_lxc_status') }} · Docker {{ states('sensor.hubinet_ops_ct106_docker_required_healthy') }}/{{ states('sensor.hubinet_ops_ct106_docker_required_total') }}
              · wynik {{ states('sensor.hubinet_ops_ct106_last_operation_result') }}
            multiline_secondary: true
            icon: mdi:docker
            color: >-
              {% set health = states(entity) %}
              {{ 'green' if health == 'healthy' else 'amber' if health == 'degraded' else 'red' }}
            badge_icon: >-
              {{ 'mdi:check-circle' if is_state(entity, 'healthy') else 'mdi:alert-circle' }}
            badge_color: >-
              {{ 'green' if is_state(entity, 'healthy') else 'red' }}
            tap_action:
              action: more-info
          - type: custom:mushroom-chips-card
            alignment: justify
            chips:
              - type: template
                icon: mdi:heart-pulse
                content: "{{ states('sensor.hubinet_ops_ct106_health_score') }}%"
                icon_color: green
                tap_action:
                  action: more-info
                  entity: sensor.hubinet_ops_ct106_health_score
              - type: template
                icon: mdi:docker
                content: "{{ states('sensor.hubinet_ops_ct106_docker_required_healthy') }}/{{ states('sensor.hubinet_ops_ct106_docker_required_total') }}"
                icon_color: >-
                  {{ 'green' if states('sensor.hubinet_ops_ct106_docker_required_healthy') == states('sensor.hubinet_ops_ct106_docker_required_total') else 'amber' }}
                tap_action:
                  action: more-info
                  entity: sensor.hubinet_ops_ct106_docker_required_healthy
              - type: template
                icon: mdi:package-up
                content: "{{ states('sensor.hubinet_ops_ct106_pending_update_count') }} pak."
                icon_color: >-
                  {{ 'amber' if states('sensor.hubinet_ops_ct106_pending_update_count') | int(0) > 0 else 'green' }}
                tap_action:
                  action: more-info
                  entity: sensor.hubinet_ops_ct106_pending_update_count
              - type: template
                icon: mdi:shield-alert-outline
                content: "{{ states('sensor.hubinet_ops_ct106_risk') }}"
                icon_color: >-
                  {% set risk = states('sensor.hubinet_ops_ct106_risk') %}
                  {{ 'red' if risk == 'high' else 'amber' if risk == 'medium' else 'green' }}
                tap_action:
                  action: more-info
                  entity: sensor.hubinet_ops_ct106_risk
              - type: template
                icon: mdi:progress-wrench
                content: "{{ states('sensor.hubinet_ops_ct106_operation_status') }}"
                icon_color: >-
                  {{ 'blue' if is_state('sensor.hubinet_ops_ct106_operation_status', 'running') else 'amber' if is_state('sensor.hubinet_ops_ct106_operation_status', 'waiting_approval') else 'green' }}
                tap_action:
                  action: more-info
                  entity: sensor.hubinet_ops_ct106_operation_status

      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: Zasoby i Docker
            subtitle: Ostatni pomiar z kontenera
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-entity-card
                entity: sensor.hubinet_ops_ct106_disk_used
                name: Dysk zajęty
                icon: mdi:harddisk
                icon_color: blue
              - type: custom:mushroom-entity-card
                entity: sensor.hubinet_ops_ct106_disk_free
                name: Wolne miejsce
                icon: mdi:database-arrow-down-outline
                icon_color: cyan
              - type: custom:mushroom-entity-card
                entity: sensor.hubinet_ops_ct106_memory_used
                name: Pamięć RAM
                icon: mdi:memory
                icon_color: purple
              - type: custom:mushroom-entity-card
                entity: sensor.hubinet_ops_ct106_lxc_status
                name: Status LXC
                icon: mdi:server
                icon_color: green
              - type: custom:mushroom-entity-card
                entity: sensor.hubinet_ops_ct106_docker_required_healthy
                name: Docker healthy
                icon: mdi:docker
                icon_color: green
              - type: custom:mushroom-entity-card
                entity: sensor.hubinet_ops_ct106_docker_required_total
                name: Docker wymagane
                icon: mdi:format-list-checks
                icon_color: blue

      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: Sterowanie
            subtitle: Operacje wymagające decyzji zawsze pytają o potwierdzenie
          - type: grid
            columns: 3
            square: false
            cards:
              - type: conditional
                conditions:
                  - condition: state
                    entity: sensor.hubinet_ops_ct106_lxc_status
                    state: stopped
                  - condition: state
                    entity: sensor.hubinet_ops_ct106_capability_start
                    state: allowed
                  - condition: state
                    entity: sensor.hubinet_ops_ct106_active_job_id
                    state: none
                  - condition: state
                    entity: sensor.hubinet_ops_ct106_lifecycle_status
                    state_not: running
                card:
                  type: custom:mushroom-template-card
                  primary: Uruchom
                  secondary: Start CT106
                  icon: mdi:play-circle-outline
                  color: green
                  tap_action:
                    action: perform-action
                    perform_action: script.hubinet_ops_start_container
                    data:
                      vmid: 106
                    confirmation:
                      title: Uruchom CT106
                      text: Uruchomić kontener CT106?
              - type: conditional
                conditions:
                  - condition: state
                    entity: sensor.hubinet_ops_ct106_lxc_status
                    state: running
                  - condition: state
                    entity: sensor.hubinet_ops_ct106_capability_shutdown
                    state: allowed
                  - condition: state
                    entity: sensor.hubinet_ops_ct106_active_job_id
                    state: none
                  - condition: state
                    entity: sensor.hubinet_ops_ct106_lifecycle_status
                    state_not: running
                  - condition: state
                    entity: sensor.hubinet_ops_ct106_operation_status
                    state_not: waiting_approval
                card:
                  type: custom:mushroom-template-card
                  primary: Wyłącz łagodnie
                  secondary: Graceful shutdown CT106
                  icon: mdi:power
                  color: red
                  tap_action:
                    action: perform-action
                    perform_action: script.hubinet_ops_shutdown_container
                    data:
                      vmid: 106
                    confirmation:
                      title: Wyłącz łagodnie CT106
                      text: Łagodnie wyłączyć kontener CT106? Usługi przestaną być dostępne.
                      confirm_text: Wyłącz CT106
                      dismiss_text: Anuluj
              - type: conditional
                conditions:
                  - condition: state
                    entity: sensor.hubinet_ops_ct106_lxc_status
                    state: running
                  - condition: state
                    entity: sensor.hubinet_ops_ct106_capability_reboot
                    state: allowed
                  - condition: state
                    entity: sensor.hubinet_ops_ct106_active_job_id
                    state: none
                  - condition: state
                    entity: sensor.hubinet_ops_ct106_lifecycle_status
                    state_not: running
                  - condition: state
                    entity: sensor.hubinet_ops_ct106_operation_status
                    state_not: waiting_approval
                card:
                  type: custom:mushroom-template-card
                  primary: Uruchom ponownie
                  secondary: Graceful reboot CT106
                  icon: mdi:restart
                  color: amber
                  tap_action:
                    action: perform-action
                    perform_action: script.hubinet_ops_reboot_container
                    data:
                      vmid: 106
                    confirmation:
                      title: Uruchom ponownie CT106
                      text: Łagodnie zrestartować kontener CT106? Usługi będą chwilowo niedostępne.
                      confirm_text: Restartuj CT106
                      dismiss_text: Anuluj
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: Skanuj aktualizacje
                secondary: Pobierz aktualną listę pakietów
                icon: mdi:magnify
                color: blue
                visibility:
                  - condition: state
                    entity: sensor.hubinet_ops_ct106_lxc_status
                    state: running
                  - condition: state
                    entity: sensor.hubinet_ops_ct106_active_job_id
                    state: none
                  - condition: state
                    entity: sensor.hubinet_ops_ct106_capability_scan
                    state: allowed
                  - condition: state
                    entity: sensor.hubinet_ops_ct106_lifecycle_status
                    state_not: running
                tap_action:
                  action: perform-action
                  perform_action: script.hubinet_ops_scan_container
                  data:
                    vmid: 106
                  confirmation:
                    title: Skan CT106
                    text: Sprawdzić dostępne aktualizacje?
              - type: custom:mushroom-template-card
                primary: Odśwież stan
                secondary: Health, zasoby i usługi
                icon: mdi:refresh
                color: cyan
                visibility:
                  - condition: state
                    entity: sensor.hubinet_ops_ct106_capability_refresh
                    state: allowed
                tap_action:
                  action: perform-action
                  perform_action: script.hubinet_ops_refresh_container
                  data:
                    vmid: 106
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.hubinet_ops_ct106_operation_status
                state: waiting_approval
            card:
              type: grid
              columns: 2
              square: false
              cards:
                - type: custom:mushroom-template-card
                  primary: Zatwierdź aktualizację
                  secondary: Snapshot, update i stabilizacja Docker
                  icon: mdi:check-decagram
                  color: green
                  visibility:
                    - condition: state
                      entity: sensor.hubinet_ops_ct106_capability_approve
                      state: allowed
                  tap_action:
                    action: perform-action
                    perform_action: script.hubinet_ops_approve_container
                    data:
                      vmid: 106
                    confirmation:
                      title: Aktualizacja CT106
                      text: Zatwierdzić aktualny plan aktualizacji?
                      confirm_text: Aktualizuj
                      dismiss_text: Anuluj
                - type: custom:mushroom-template-card
                  primary: Odrzuć plan
                  secondary: Nie wykonuj aktualizacji
                  icon: mdi:close-circle-outline
                  color: red
                  visibility:
                    - condition: state
                      entity: sensor.hubinet_ops_ct106_capability_reject
                      state: allowed
                  tap_action:
                    action: perform-action
                    perform_action: script.hubinet_ops_reject_container
                    data:
                      vmid: 106
                    confirmation:
                      title: Odrzucenie planu
                      text: Odrzucić aktualny plan CT106?
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.hubinet_ops_ct106_health_status
                state: critical
            card:
              type: custom:mushroom-template-card
              primary: Ponów healthcheck
              secondary: Sprawdź stabilizację usług jeszcze raz
              icon: mdi:heart-pulse
              color: amber
              visibility:
                - condition: state
                  entity: sensor.hubinet_ops_ct106_capability_retry_healthcheck
                  state: allowed
                - condition: state
                  entity: sensor.hubinet_ops_ct106_active_job_id
                  state: none
              tap_action:
                action: perform-action
                perform_action: script.hubinet_ops_retry_healthcheck
                data:
                  vmid: 106
                confirmation:
                  text: Ponowić healthcheck CT106?
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.hubinet_ops_ct106_operation_status
                state: manual_intervention
              - condition: state
                entity: sensor.hubinet_ops_ct106_rollback_allowed
                state: allowed
            card:
              type: custom:mushroom-template-card
              primary: Przywróć snapshot
              secondary: Ręczny rollback ostatniej nieudanej operacji
              icon: mdi:backup-restore
              color: red
              tap_action:
                action: perform-action
                perform_action: script.hubinet_ops_rollback
                data:
                  vmid: 106
                confirmation:
                  title: Rollback CT106
                  text: Przywrócić zapisany snapshot?
                  confirm_text: Przywróć
                  dismiss_text: Anuluj

      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: Weryfikacja końcowa
            subtitle: Integralność pakietów i wymagane usługi po aktualizacji
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-entity-card
                entity: sensor.hubinet_ops_ct106_verification_status
                name: Wynik
                icon: mdi:check-decagram-outline
              - type: custom:mushroom-entity-card
                entity: sensor.hubinet_ops_ct106_last_verification
                name: Ostatnia weryfikacja
                icon: mdi:clock-check-outline
              - type: custom:mushroom-entity-card
                entity: sensor.hubinet_ops_ct106_apt_check
                name: APT
                icon: mdi:package-check
              - type: custom:mushroom-entity-card
                entity: sensor.hubinet_ops_ct106_dpkg_audit
                name: dpkg
                icon: mdi:shield-check-outline
              - type: custom:mushroom-entity-card
                entity: sensor.hubinet_ops_ct106_reboot_required
                name: Restart wymagany
                icon: mdi:restart-alert
              - type: custom:mushroom-entity-card
                entity: sensor.hubinet_ops_ct106_packages_remaining
                name: Pozostałe pakiety
                icon: mdi:package-variant
              - type: custom:mushroom-template-card
                entity: sensor.hubinet_ops_ct106_docker_required_healthy
                primary: Docker
                secondary: >-
                  {{ states('sensor.hubinet_ops_ct106_docker_required_healthy') }}/{{ states('sensor.hubinet_ops_ct106_docker_required_total') }} healthy
                icon: mdi:docker
                color: green

      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: Recovery scan
            subtitle: Jednorazowy skan po rzeczywistym odzyskaniu CT106
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-entity-card
                entity: sensor.hubinet_ops_ct106_recovery_scan_status
                name: Status
                icon: mdi:progress-clock
              - type: custom:mushroom-entity-card
                entity: sensor.hubinet_ops_ct106_last_recovery_scan
                name: Ostatnie uruchomienie
                icon: mdi:calendar-refresh
              - type: custom:mushroom-entity-card
                entity: sensor.hubinet_ops_ct106_last_recovery_scan_result
                name: Ostatni wynik
                icon: mdi:text-box-check-outline
              - type: custom:mushroom-template-card
                entity: sensor.hubinet_ops_ct106_health_status
                primary: Włączony
                secondary: >-
                  {{ 'tak' if state_attr(entity, 'recovery_scan_enabled') else 'nie' }}
                icon: mdi:toggle-switch
                color: blue

      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: Aktualna operacja
            subtitle: MQTT aktualizuje etap, postęp i logi na żywo
          - type: custom:mushroom-template-card
            entity: sensor.hubinet_ops_ct106_operation_status
            primary: >-
              {{ states(entity) | replace('_', ' ') | title }}
            secondary: >-
              Etap: {{ states('sensor.hubinet_ops_ct106_job_stage') }}
              · postęp: {{ states('sensor.hubinet_ops_ct106_job_progress') }}%
              {% set event = state_attr('sensor.hubinet_ops_ct106_health_status', 'last_job_event') or {} %}
              {% if event.get('message') %}· {{ event.get('message') }}{% endif %}
            multiline_secondary: true
            icon: >-
              {% set stage = states('sensor.hubinet_ops_ct106_job_stage') %}
              {{ 'mdi:package-up' if stage == 'updating' else 'mdi:backup-restore' if 'rollback' in stage else 'mdi:heart-pulse' if stage == 'healthcheck' else 'mdi:progress-wrench' }}
            color: >-
              {% set op = states(entity) %}
              {{ 'blue' if op == 'running' else 'amber' if op == 'waiting_approval' else 'red' if op in ['failed', 'manual_intervention'] else 'green' }}
            badge_text: "{{ states('sensor.hubinet_ops_ct106_job_progress') }}%"
            badge_color: >-
              {{ 'blue' if is_state(entity, 'running') else 'grey' }}
            tap_action:
              action: more-info
          - type: markdown
            title: Logi live
            entity_id:
              - sensor.hubinet_ops_ct106_health_status
              - sensor.hubinet_ops_ct106_job_progress
            card_size: 8
            content: >-
              {% set events = state_attr('sensor.hubinet_ops_ct106_health_status', 'recent_job_events') or [] %}
              {% set icons = {
                'preflight': '🧪', 'snapshot': '📸', 'updating': '📦',
                'waiting_services': '⏳', 'healthcheck': '❤️', 'repair': '🛠️',
                'rollback': '↩️', 'rollback_wait': '⏳', 'rollback_healthcheck': '❤️',
                'completed': '✅', 'failed': '❌'
              } %}
              {% if events %}
              | Czas | Etap | % | Zdarzenie |
              |:--|:--|--:|:--|
              {% for event in events[-25:] | reverse %}
              | `{{ as_timestamp(event.created_at, 0) | timestamp_custom('%H:%M:%S', true) }}` | {{ icons.get(event.stage, '•') }} **{{ event.stage | default('idle') }}** | **{{ event.progress | default(0) }}** | {{ event.message | default('') | replace('|', '¦') }} |
              {% endfor %}
              {% else %}
              Brak zdarzeń dla CT106. Pojawią się tutaj podczas skanu, aktualizacji, naprawy albo rollbacku.
              {% endif %}

      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: Pakiety
            subtitle: Plan zatwierdzany ręcznie
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: sensor.hubinet_ops_ct106_pending_update_count
                above: 0
            card:
              type: markdown
              entity_id:
                - sensor.hubinet_ops_ct106_health_status
                - sensor.hubinet_ops_ct106_pending_update_count
              card_size: 8
              content: >-
                {% set updates = state_attr('sensor.hubinet_ops_ct106_health_status', 'updates') or {} %}
                {% set packages = updates.get('packages', []) %}
                {% set meta = state_attr('sensor.hubinet_ops_ct106_health_status', 'attribute_payload') or {} %}
                {% set total = meta.get('packages_total', states('sensor.hubinet_ops_ct106_pending_update_count') | int(0)) | int(0) %}
                {% set visible = packages | count %}
                **{{ total }} pakietów · ryzyko {{ states('sensor.hubinet_ops_ct106_risk') }}**

                {% if meta.get('truncated') and visible < total %}
                _Podgląd MQTT zawiera {{ visible }} z {{ total }} pakietów (limit atrybutów 10 KB)._

                {% endif %}

                | Pakiet | Obecna | Docelowa |
                |:--|:--|:--|
                {% for package in packages[:30] %}
                | `{{ package.name }}` | `{{ package.current | default('?') }}` | `{{ package.target | default('?') }}` |
                {% endfor %}
                {% if visible > 30 %}

                _…oraz {{ visible - 30 }} kolejnych widocznych pakietów._
                {% endif %}
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: sensor.hubinet_ops_ct106_pending_update_count
                below: 1
            card:
              type: custom:mushroom-template-card
              primary: System aktualny
              secondary: Brak oczekujących pakietów
              icon: mdi:package-check
              color: green

      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: Historia i diagnostyka
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-entity-card
                entity: sensor.hubinet_ops_ct106_last_scan
                name: Ostatni skan
                icon: mdi:magnify-scan
                icon_color: blue
              - type: custom:mushroom-entity-card
                entity: sensor.hubinet_ops_ct106_last_update
                name: Ostatnia aktualizacja
                icon: mdi:update
                icon_color: green
              - type: custom:mushroom-entity-card
                entity: sensor.hubinet_ops_ct106_active_plan_id
                name: Aktywny plan
                icon: mdi:clipboard-text-clock-outline
                icon_color: amber
              - type: custom:mushroom-entity-card
                entity: sensor.hubinet_ops_ct106_active_job_id
                name: Aktywny job
                icon: mdi:identifier
                icon_color: blue
          - type: custom:mushroom-template-card
            entity: sensor.hubinet_ops_ct106_last_error
            primary: Ostatni błąd
            secondary: "{{ states(entity) }}"
            multiline_secondary: true
            icon: mdi:alert-circle-outline
            color: >-
              {{ 'green' if states(entity) in ['none', 'unknown', ''] else 'red' }}
            tap_action:
              action: more-info
