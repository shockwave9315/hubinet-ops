view_update_plan:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: hubinet_ops

approve_update_plan:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: hubinet_ops

view_health_contract:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: hubinet_ops

set_health_contract:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: hubinet_ops
    probes:
      required: true
      selector:
        object:
    expected_revision:
      required: false
      selector:
        number:
          min: 0
          mode: box

clear_health_contract:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: hubinet_ops
    expected_revision:
      required: false
      selector:
        number:
          min: 0
          mode: box

start_update:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: hubinet_ops

view_update_job:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: hubinet_ops
    events:
      required: false
      selector:
        number:
          min: 0
          max: 200
          mode: box

resume_update:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: hubinet_ops

rollback_update:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: hubinet_ops
