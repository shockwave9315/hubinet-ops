# Sanitized structural fixture of the entity registry observed in production after 0.3.1.
# It contains no .storage data, registry metadata, credentials, or production addresses.
registry_version: production-0.3.1
groups:
  agent:
    unique_pattern: hubinet_ops_agent_{key}
    entity_pattern: sensor.hubinet_ops_agent_{suffix}
    vmids: [null]
    suffixes:
      availability: availability
      version: version
      configured_container_count: configured_container_count
      configured_resource_count: configured_resource_count
      configured_lxc_count: configured_lxc_count
      configured_qemu_count: configured_qemu_count
      active_job_count: active_job_count
      last_refresh: last_refresh

  qemu_haos:
    unique_pattern: hubinet_ops_vm_{vmid}_{key}
    entity_pattern: sensor.hubinet_ops_vm{vmid}_{suffix}
    vmids: [100]
    suffixes:
      health_status: health_status
      health_score: health_score
      runtime_status: runtime_status
      qemu_status: qemu_status
      uptime_seconds: uptime
      cpu_usage: cpu_usage
      cpu_cores: cpu_cores
      memory_used_bytes: memory_used
      memory_total_bytes: memory_total
      disk_used_bytes: disk_used
      disk_total_bytes: disk_total
      network_in_bytes: network_received
      network_out_bytes: network_sent
      guest_agent_status: guest_agent
      ip_addresses: ip_addresses
      last_refresh: last_refresh
      last_error: last_error
      dashboard_path: dashboard_path

  apt_lxc:
    unique_pattern: hubinet_ops_ct_{vmid}_{key}
    entity_pattern: sensor.hubinet_ops_ct{vmid}_{suffix}
    vmids: [101, 102, 103, 104, 105, 106, 107, 108, 109]
    suffixes:
      health_status: health_status
      health_score: health_score
      lxc_status: lxc_status
      runtime_status: runtime_status
      uptime_seconds: uptime
      update_status: update_status
      operation_status: operation_status
      job_stage: job_stage
      job_progress: job_progress
      pending_updates: pending_update_count
      risk: risk
      disk_used_percent: disk_used
      disk_free_mb: disk_free
      memory_used_percent: memory_used
      docker_required_healthy: docker_required_healthy
      docker_required_total: docker_required_total
      active_plan_id: active_plan_id
      active_job_id: active_job_id
      last_scan: last_scan
      last_refresh: last_refresh
      last_update: last_update
      last_error: last_error
      last_operation_result: last_operation_result
      rollback_allowed: rollback_allowed
      last_job_event: last_job_event
      lifecycle_status: lifecycle_status
      lifecycle_action: lifecycle_action
      verification_status: verification_status
      last_verification: last_verification
      apt_check_ok: apt_check
      dpkg_audit_ok: dpkg_audit
      reboot_required: reboot_required
      packages_remaining_count: packages_remaining
      recovery_scan_status: recovery_scan_status
      last_recovery_scan: last_recovery_scan
      last_recovery_scan_result: last_recovery_scan_result
      capability_start: capability_start
      capability_shutdown: capability_shutdown
      capability_reboot: capability_reboot
      capability_refresh: capability_refresh
      capability_scan: capability_scan
      capability_approve: capability_approve
      capability_reject: capability_reject
      capability_retry_healthcheck: capability_retry_healthcheck
      capability_rollback: capability_rollback
      dashboard_path: dashboard_path

  agent_self:
    unique_pattern: hubinet_ops_ct_{vmid}_{key}
    entity_pattern: sensor.hubinet_ops_ct{vmid}_{suffix}
    vmids: [110]
    suffixes:
      health_status: health_status
      health_score: health_score
      runtime_status: runtime_status
      lxc_status: lxc_status
      uptime_seconds: uptime
      cpu_cores: cpu_cores
      cpu_load_1m: cpu_load_1m
      memory_used_bytes: memory_used
      memory_total_bytes: memory_total
      memory_available_bytes: memory_available
      disk_used_bytes: disk_used
      disk_total_bytes: disk_total
      disk_free_bytes: disk_free
      service_status: service_status
      api_health: api_health
      agent_version: agent_version
      recent_warnings: recent_warnings
      last_refresh: last_refresh
      last_error: last_error
      dashboard_path: dashboard_path
